<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortexAgent Sidebar</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0;
         background: #0e0e10; color: #e6e6e6; height: 100vh; display: flex;
         flex-direction: column; }
  header { background: #1f1f23; padding: 8px 12px; border-bottom: 1px solid #333;
           display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  /* WOLF_HEAD_SLOT: placeholder for wolf head ASCII art */
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block;
                flex-shrink: 0; }
  .connected { background: #3fb950; box-shadow: 0 0 4px #3fb950; }
  .disconnected { background: #f85149; }
  .reconnecting { background: #d29922; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
  .status-text { font-size: 11px; color: #888; }
  .settings-btn { background: none; border: 1px solid #444; color: #888; cursor: pointer;
                  font-size: 11px; padding: 2px 6px; border-radius: 3px; }
  .settings-btn:hover { background: #2a2a2e; }
  .messages { flex: 1; overflow-y: auto; padding: 8px; }
  .msg { padding: 6px 10px; margin: 4px 0; border-radius: 6px; white-space: pre-wrap;
         word-break: break-word; font-size: 13px; }
  .user { background: #2a4d8a; }
  .assistant { background: #1f1f23; border: 1px solid #333; }
  .error { background: #5a1d1d; color: #ffaaaa; }
  .system { background: #1a3a1a; color: #8bc48b; font-size: 11px; }
  .input-area { display: flex; gap: 6px; padding: 8px; background: #1f1f23;
                border-top: 1px solid #333; flex-shrink: 0; }
  textarea { flex: 1; background: #0e0e10; color: #e6e6e6; border: 1px solid #333;
             border-radius: 4px; padding: 6px; resize: none; font-family: inherit;
             font-size: 13px; min-height: 36px; max-height: 120px; }
  button { background: #3a7bd5; color: white; border: none; padding: 6px 10px;
           border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .mic-btn { background: #1f1f23; border: 1px solid #444; padding: 6px 8px; }
  .mic-btn.listening { background: #5a1d1d; border-color: #f85149; }
  .tts-btn { background: #1f1f23; border: 1px solid #444; padding: 2px 6px;
             font-size: 11px; }
  .tts-btn.active { background: #2a4d8a; border-color: #3a7bd5; }
  .toast { position: fixed; bottom: 60px; left: 8px; right: 8px; padding: 8px;
           background: #5a1d1d; color: #ffaaaa; border-radius: 6px; font-size: 12px;
           text-align: center; display: none; z-index: 100; }
  .toast.show { display: block; }
  .settings-panel { display: none; padding: 8px; background: #1f1f23;
                    border-bottom: 1px solid #333; font-size: 12px; }
  .settings-panel.open { display: block; }
  .settings-panel label { display: block; margin: 4px 0; color: #888; }
  .settings-panel input { width: 100%; background: #0e0e10; color: #e6e6e6;
                          border: 1px solid #333; padding: 4px 6px; border-radius: 3px;
                          box-sizing: border-box; }
  .settings-panel .save-btn { margin-top: 6px; width: 100%; }
</style>
</head>
<body>
<header>
  <span class="status-dot disconnected" id="statusDot"></span>
  <h1>CortexAgent</h1>
  <span class="status-text" id="statusText">disconnected</span>
  <button class="settings-btn" id="settingsBtn">⚙</button>
</header>
<div class="settings-panel" id="settingsPanel">
  <label>Host</label>
  <input type="text" id="hostInput" placeholder="127.0.0.1:8090">
  <label>Auth Token</label>
  <input type="password" id="tokenInput" placeholder="optional">
  <button class="save-btn" id="saveSettings">Save</button>
</div>
<div class="messages" id="messages"></div>
<div class="toast" id="toast"></div>
<div class="input-area">
  <button class="mic-btn" id="micBtn" title="Speech-to-text">🎤</button>
  <textarea id="input" placeholder="Ask CortexAgent..." rows="1"></textarea>
  <button id="sendBtn" disabled>Send</button>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
