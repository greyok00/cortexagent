[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexagent"
version = "0.9.1"
description = "Local-first agent harness: ReAct loop over a local llama.cpp server, one-file NJSON memory, control-socket daemon, and keyless web research through optional MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "greyok00" }]
keywords = ["agent", "local", "llama.cpp", "offline", "mcp", "web-research", "memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/greyok00/cortexagent"
Repository = "https://github.com/greyok00/cortexagent"
Issues = "https://github.com/greyok00/cortexagent/issues"

[project.scripts]
cortexagent = "engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "engine*", "memory*", "research*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.png", "*.css", "*.txt", "data/*", "**/*.json"]
