name: Publish container package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download wheel from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "cortexagent-*x86_64.whl"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: ver
        run: |
          wheel=$(ls cortexagent-*.whl | head -1)
          echo "version=$(echo "$wheel" | sed 's/cortexagent-//; s/-.*//')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cortexagent:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cortexagent:latest