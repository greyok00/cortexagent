<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CortexAgent — Pipeline Visualization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  height: 100vh;
  user-select: none;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 30% 30% at 25% 35%, rgba(59,130,246,0.08), transparent),
    radial-gradient(ellipse 25% 25% at 75% 65%, rgba(139,92,246,0.06), transparent),
    radial-gradient(ellipse 20% 20% at 55% 80%, rgba(6,182,212,0.05), transparent);
  animation: nebula 30s ease-in-out infinite alternate;
}
@keyframes nebula {
  0% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
  100% { opacity: 0.6; transform: scale(1.05); }
}
canvas { display: block; position: fixed; inset: 0; z-index: 0; }

#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #0a0a0f; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  transition: opacity 0.6s ease;
}
#loader.hidden { opacity: 0; pointer-events: none; }
#loader .ring {
  width: 50px; height: 50px; border-radius: 50%;
  border: 2px solid rgba(201,168,76,0.15);
  border-top-color: #c9a84c;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loader .label {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: #666;
}

#stage-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  pointer-events: none;
}
#stage-nav > * { pointer-events: auto; }

.stage-flow {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(10,10,26,0.72);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid rgba(201,168,76,0.14);
  border-radius: 14px;
  padding: 8px 10px;
  flex-wrap: wrap;
  max-width: calc(100vw - 420px);
}
.flow-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.flow-stage {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  border-radius: 9px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.35s ease;
}
.flow-stage:hover {
  background: rgba(255,255,255,0.05);
  transform: translateY(-1px);
}
.flow-stage.active {
  border-color: var(--stage-color, rgba(201,168,76,0.5));
  background: color-mix(in srgb, var(--stage-color, #c9a84c) 16%, transparent);
  box-shadow: 0 0 20px color-mix(in srgb, var(--stage-color, #c9a84c) 28%, transparent);
}
.flow-stage.done {
  opacity: 0.8;
}
.flow-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  border: 1.5px solid rgba(201,168,76,0.35);
  color: #c9a84c;
  flex-shrink: 0;
  transition: all 0.3s ease;
  font-variant-numeric: tabular-nums;
}
.flow-stage.active .flow-num {
  background: var(--stage-color, #c9a84c);
  color: #0a0a0f;
  border-color: var(--stage-color, #c9a84c);
  box-shadow: 0 0 14px var(--stage-color, #c9a84c);
}
.flow-name {
  font-size: 13px;
  font-weight: 600;
  color: #c8c8d0;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.flow-stage.active .flow-name { color: #fff; }
.flow-arrow {
  color: #888;
  font-size: 15px;
  flex-shrink: 0;
  animation: arrowPulse 2s ease-in-out infinite;
}
@keyframes arrowPulse {
  0%, 100% { opacity: 0.3; transform: translateX(0); }
  50% { opacity: 1; transform: translateX(2px); }
}

.prompt-selector {
  display: flex;
  align-items: center;
  gap: 10px;
}
.prompt-selector label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #666;
}
.prompt-dropdown {
  position: relative;
}
.prompt-dropdown select {
  appearance: none;
  background: rgba(10,10,26,0.7);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 8px;
  padding: 8px 32px 8px 12px;
  font-size: 12px;
  color: #e0e0e0;
  font-family: inherit;
  cursor: pointer;
  min-width: 220px;
  transition: all 0.3s ease;
}
.prompt-dropdown select:hover {
  border-color: rgba(201,168,76,0.3);
}
.prompt-dropdown select:focus {
  outline: none;
  border-color: #c9a84c;
}
.prompt-dropdown::after {
  content: '▾';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: #666;
  font-size: 12px;
}
.prompt-dropdown select option {
  background: #0a0a16;
  color: #e0e0e0;
  padding: 8px;
}

#controls {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.control-row {
  display: flex;
  align-items: center;
  gap: 16px;
  background: rgba(10,10,26,0.7);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(201,168,76,0.12);
  padding: 12px 20px;
  border-radius: 14px;
}
.ctrl-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(201,168,76,0.3);
  background: rgba(201,168,76,0.08);
  color: #c9a84c;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
}
.ctrl-btn:hover {
  background: rgba(201,168,76,0.2);
  border-color: #c9a84c;
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
}
.ctrl-btn.active {
  background: #c9a84c;
  color: #0a0a0f;
  box-shadow: 0 0 24px rgba(201,168,76,0.4);
}
.speed-control {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.speed-control label {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #666;
}
.speed-control input[type="range"] {
  width: 180px;
  height: 4px;
  -webkit-appearance: none;
  background: rgba(201,168,76,0.2);
  border-radius: 2px;
  outline: none;
}
.speed-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #c9a84c;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(201,168,76,0.5);
}
.speed-val {
  font-size: 12px;
  font-weight: 600;
  color: #c9a84c;
  font-variant-numeric: tabular-nums;
  min-width: 40px;
  text-align: center;
}
.divider {
  width: 1px;
  height: 32px;
  background: rgba(201,168,76,0.2);
}

#content {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.stage-content {
  max-width: 720px;
  width: 90%;
  text-align: center;
  opacity: 0;
  transform: scale(0.95);
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.stage-content.active {
  opacity: 1;
  transform: scale(1);
}
.stage-label {
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #6a6a72;
  margin-bottom: 14px;
}
.stage-title {
  font-size: 46px;
  font-weight: 300;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 6px;
  text-shadow: 0 0 40px color-mix(in srgb, currentColor 35%, transparent);
  transition: color 0.6s ease;
  font-family: 'Cormorant Garamond', 'Times New Roman', serif;
}
.stage-sub {
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #c9a84c;
  margin-bottom: 28px;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0.75;
}
.stage-prompt {
  font-size: 17px;
  line-height: 1.7;
  color: #f0f0f0;
  font-family: 'Cormorant Garamond', 'Times New Roman', serif;
  font-style: italic;
  font-weight: 400;
  letter-spacing: 0.015em;
  text-align: center;
  white-space: normal;
  word-break: break-word;
  max-width: 720px;
  padding: 28px 32px;
  background: linear-gradient(180deg, rgba(201,168,76,0.04) 0%, transparent 100%);
  border-top: 1px solid rgba(201,168,76,0.22);
  border-bottom: 1px solid rgba(201,168,76,0.22);
  position: relative;
}
.stage-prompt code {
  font-family: 'JetBrains Mono', monospace;
  background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.15);
  padding: 1px 5px;
  border-radius: 4px;
  color: #c9a84c;
  font-size: 13px;
  font-style: normal;
}
.stage-prompt p { margin-bottom: 10px; }
.stage-prompt p:last-child { margin-bottom: 0; }

/* ── Sand host + particles ───────────────────────────────────────────────── */
#sand-host {
  position: relative;
  display: inline-block;
  line-height: 1.7;
  vertical-align: middle;
}
.sand-letter {
  display: inline-block;
  position: relative;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.sand-letter.dissolving {
  opacity: 0;
  transform: translateY(-6px) scale(0.9);
}
.sand-space { display: inline-block; }
.sand-particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 5;
  will-change: transform, opacity;
}

/* ── Slide-in right-side explainer drawer ───────────────────────────────── */
#explainer {
  position: fixed;
  top: 96px;
  right: 28px;
  width: 360px;
  max-height: calc(100vh - 180px);
  z-index: 60;
  background: linear-gradient(160deg, rgba(20,20,32,0.92), rgba(10,10,18,0.92));
  backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid rgba(201,168,76,0.18);
  border-radius: 14px;
  padding: 24px 26px;
  opacity: 0;
  transform: translateX(40px);
  transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1), transform 0.55s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
  overflow-y: auto;
  box-shadow: 0 16px 48px rgba(0,0,0,0.45);
}
#explainer.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
#explainer .x-num {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #c9a84c;
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 4px;
  opacity: 0.85;
}
#explainer .x-title {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
  font-family: 'Cormorant Garamond', serif;
  margin-bottom: 6px;
}
#explainer .x-sub {
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #6a6a72;
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(201,168,76,0.16);
}
#explainer .x-body {
  font-size: 14px;
  line-height: 1.7;
  color: #d8d8e0;
}
#explainer .x-body p { margin-bottom: 10px; }
#explainer .x-body code {
  font-family: 'JetBrains Mono', monospace;
  background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.15);
  padding: 1px 5px;
  border-radius: 4px;
  color: #c9a84c;
  font-size: 12px;
}
#explainer .x-tokens {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(201,168,76,0.16);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #c9a84c;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#explainer .x-tokens .v {
  font-size: 14px;
  font-weight: 700;
}

/* On narrow screens the drawer collapses below the stage content */
@media (max-width: 1100px) {
  #explainer {
    right: 16px; width: 300px;
  }
}
.stage-prompt code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.15);
  padding: 1px 5px;
  border-radius: 4px;
  color: #c9a84c;
  font-size: 13px;
}
.stage-prompt p { margin-bottom: 10px; }
.stage-prompt p:last-child { margin-bottom: 0; }

#transition {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: radial-gradient(circle at center, rgba(201,168,76,0.18), transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.55s ease;
}
#transition.flash {
  opacity: 1;
}

#status {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 100;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #888;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  gap: 8px;
}
.breathing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #c9a84c;
  box-shadow: 0 0 8px rgba(201,168,76,0.6);
  animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: 0.45; transform: scale(0.85); }
  50%      { opacity: 1.0;  transform: scale(1.15); }
}
</style>
</head>
<body>

<div id="loader">
  <div class="ring"></div>
  <div class="label">Loading Pipeline Visualization</div>
</div>

<div id="stage-nav">
  <div class="stage-flow" id="stage-flow"></div>
  <div class="prompt-selector">
    <label>Previous Prompts</label>
    <div class="prompt-dropdown">
      <select id="prompt-select"></select>
    </div>
  </div>
</div>

<div id="content">
  <div class="stage-content active" id="stage-display">
    <div class="stage-label" id="stage-label">—</div>
    <div class="stage-title" id="stage-title">SELECT A PROMPT</div>
    <div class="stage-sub" id="stage-sub">awaiting input</div>
    <div class="stage-prompt" id="stage-prompt"><span class="sand-host" id="sand-host"></span></div>
  </div>
</div>

<aside id="explainer">
  <div class="x-num" id="x-num">—</div>
  <div class="x-title" id="x-title">—</div>
  <div class="x-sub" id="x-sub">—</div>
  <div class="x-body" id="x-body">—</div>
  <div class="x-tokens">
    <span>Tokens</span><span class="v" id="x-tokens-v">—</span>
  </div>
</aside>

<div id="controls">
  <div class="control-row">
    <button class="ctrl-btn" id="btn-prev" title="Previous Stage">◀</button>
    <button class="ctrl-btn" id="btn-play" title="Play/Pause">▶</button>
    <button class="ctrl-btn" id="btn-next" title="Next Stage">▶</button>
    <div class="divider"></div>
    <div class="speed-control">
      <label>Speed</label>
      <input type="range" id="speed-slider" min="0.5" max="5" step="0.5" value="1.5">
    </div>
    <span class="speed-val" id="speed-val">1.5×</span>
    <div class="divider"></div>
    <button class="ctrl-btn" id="btn-reset" title="Reset">↺</button>
  </div>
</div>

<div id="transition"></div>
<div id="status"><span class="breathing-dot"></span><span id="status-text">Live · local</span></div>

<script type="importmap">
{
  "imports": {
    "three": "/three.module.min.js",
    "three/addons/": "/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const STAGES = [
  {
    name: 'COLLECT', icon: '📥', color: '#7AA2F7', sub: 'prompt_intake',
    desc: 'Collect the user\'s prompt and build the initial token component set.',
    detail: `<p>Your prompt arrives and is immediately parsed into <strong>typed token components</strong>, each categorized by source and priority:</p>
<p><code>system</code> — core policy & behavioral rules (pinned)<br>
<code>user</code> — your actual request (pinned)<br>
<code>tool_schema</code> — tool definitions & parameters<br>
<code>retrieval</code> — search / memory / file context (high)<br>
<code>history</code> — previous turns (compressible)<br>
<code>tool_output</code> — tool results (compressible)</p>
<p>Each block is assigned a <strong>priority tier</strong> — pinned, high, compressible, or discardable — which determines how SlimToken handles it later.</p>`,
    tokenEst: 3200
  },
  {
    name: 'COMPOSE', icon: '🧩', color: '#9ECE6A', sub: 'frame_assemble',
    desc: 'Frame the collected blocks with the active policy, reserving output capacity and validating the request structure.',
    detail: `<p>Compose applies the <strong>policy frame</strong> to the typed blocks:</p>
<p>• Reserves output token capacity (<code>max_output_tokens</code>)<br>
• Validates a usable user request exists<br>
• Sums total tokens against the input budget<br>
• Marks the request <span style="color:#9ECE6A">valid</span> or flags errors</p>
<p>E.g. a 156,000-token window with 3,431 output reserved leaves <code>152,569</code> tokens of input budget.</p>`,
    tokenEst: 3200
  },
  {
    name: 'FRAME_OF_REF', icon: '🎯', color: '#BB9AF3', sub: 'frame_of_ref',
    desc: 'Determine the model\'s frame of reference — profile, system instructions, and behavioral constraints.',
    detail: `<p>Selects the active <strong>system profile</strong> and behavioral constraints based on route and model identity:</p>
<p>• Model-specific system instructions (e.g. CortexAgent profile)<br>
• Behavioral constraints from skills and policies<br>
• Output contracts & response format<br>
• Tool authorization & capability flags</p>
<p>This frame is <strong>pinned</strong> — always preserved through minification.</p>`,
    tokenEst: 1842
  },
  {
    name: 'MEMORY_CHECK', icon: '🧠', color: '#E0AF68', sub: 'memory_check',
    desc: 'Check hot memory and previous minification runs for patterns that might affect compression.',
    detail: `<p>Checks whether SlimToken has <strong>seen similar prompts</strong> before:</p>
<p>• Hot memory cache lookup — recent structure?<br>
• Minify run history — typical savings %?<br>
• Pattern matching — deduplicatable tool outputs?</p>
<p>Matches enable <span style="color:#E0AF68">aggressive optimization</span>; otherwise conservative defaults.</p>`,
    tokenEst: 3200
  },
  {
    name: 'SLIMTOKEN', icon: '⚡', color: '#C9A84C', sub: 'slimtoken_minify',
    desc: 'Apply the SlimToken minification pipeline — the core compression engine, 7 sub-stages.',
    detail: `<p><strong>SLIMTOKEN</strong> is the heart of context optimization. It runs 7 sub-stages:</p>
<p><code>1. TOOLS</code> — strip unused params, simplify schemas<br>
<code>2. SYSTEM</code> — remove filler, blank-line bloat<br>
<code>3. MESSAGES</code> — strip leading filler phrases<br>
<code>4. DEDUP</code> — stub duplicate tool_results by hash<br>
<code>5. DISTILL</code> — compress older turns<br>
<code>5b. DOM</code> — prune large HTML results (optional)<br>
<code>6. BUDGET</code> — hard token budget enforcement</p>
<p>All stages are <strong>pair-safe</strong> — a failure in one never breaks inference.</p>`,
    tokenEst: 2400,
    hasSubStages: true
  },
  {
    name: 'TOOL_ROUTING', icon: '🛠', color: '#7FD4C9', sub: 'tool_routing',
    desc: 'Route the optimized prompt to the appropriate tools — determine which to execute and in what order.',
    detail: `<p>Determines <strong>which tools</strong> the model needs to invoke:</p>
<p>• Analyzes tool schemas against the request<br>
• Builds the tool_call structure with typed params<br>
• Registers tool results for the next iteration<br>
• Handles multi-step tool chains (read → analyze → write)</p>
<p>Tool routing is <strong>high priority</strong> — never compressed, a missing tool call breaks functionality.</p>`,
    tokenEst: 2856
  },
  {
    name: 'FINALIZE', icon: '✅', color: '#9ECE6A', sub: 'context_fit',
    desc: 'Validate the optimized request fits the context window and is provider-ready.',
    detail: `<p>Final <strong>sanity checks</strong>:</p>
<p>• <code>valid</code> — fits the budget?<br>
• <code>fits</code> — still fits after minification?<br>
• <code>schema_valid</code> — tool schemas well-formed?<br>
• <code>template_applied</code> — provider template correct?</p>
<p>If it doesn't fit, finalize triggers a <span style="color:#F7768E">hard drop</span> — the oldest history turns are removed until it fits. SlimToken's budget backstop.</p>`,
    tokenEst: 2400
  },
  {
    name: 'PREFILL', icon: '📖', color: '#7AA2F7', sub: 'prefill',
    desc: 'Send the optimized prompt to the model for input token evaluation (prefill phase).',
    detail: `<p>The <strong>fast first pass</strong> where the model reads the entire optimized prompt:</p>
<p>• <code>input_tokens</code> — how many tokens the model processes<br>
• <code>input_tps</code> — tokens per second during prefill<br>
• VRAM used during prefill</p>
<p>Typically very fast — a few hundred tokens/second on consumer hardware. The model builds its internal state representations.</p>`,
    tokenEst: 2400
  },
  {
    name: 'DECODE', icon: '⏳', color: '#F7768E', sub: 'decode',
    desc: 'The model generates the response token-by-token — the slow, compute-intensive phase.',

<p>• <code>output_tokens</code> — total generated<br>
• <code>output_tps</code> — decoding speed<br>
• Latency — first token to last</p>
<p>Real-time TPS is tracked so you can see if the model is running slow (VRAM pressure, CPU contention). Output minification runs here too.</p>`,

// ── Minimal-luxury gyroscope: thin white + gold rings ──────────────────────
const gyro = new THREE.Group();
const ringDefs = [
  // white — large outer
  { r: 6.2, tube: 0.012, tiltX: Math.PI / 2.1, tiltZ: 0,            speed:  0.006, color: 0xffffff, opacity: 0.32 },
  // gold — primary
  { r: 5.0, tube: 0.018, tiltX: Math.PI / 2.6, tiltZ: Math.PI / 5,    speed: -0.009, color: 0xc9a84c, opacity: 0.55 },
  // white — mid
  { r: 3.9, tube: 0.008, tiltX: -Math.PI / 2.4, tiltZ: -Math.PI / 3,  speed:  0.011, color: 0xffffff, opacity: 0.20 },
  // gold — inner accent
  { r: 2.7, tube: 0.014, tiltX: Math.PI / 3.5, tiltZ: Math.PI / 7,    speed: -0.015, color: 0xc9a84c, opacity: 0.42 },
];
const gyroRings = ringDefs.map((d) => {

  ring.rotation.z = d.tiltZ;

});
scene.add(gyro);

// Subtle ambient haze (low count, monochrome, slow drift)
const AMBIENT_COUNT = 220;
const ambientGeom = new THREE.BufferGeometry();
const ambientPos = new Float32Array(AMBIENT_COUNT * 3);
for (let i = 0; i < AMBIENT_COUNT; i++) {
  ambientPos[i*3]   = (Math.random() - 0.5) * 60;
  ambientPos[i*3+1] = (Math.random() - 0.5) * 28;
  ambientPos[i*3+2] = (Math.random() - 0.5) * 40;
}
ambientGeom.setAttribute('position', new THREE.BufferAttribute(ambientPos, 3));
const ambientPoints = new THREE.Points(ambientGeom, new THREE.PointsMaterial({
  size: 0.05, color: 0xc9a84c, transparent: true, opacity: 0.18,
  blending: THREE.AdditiveBlending, sizeAttenuation: true,
  depthWrite: false,
}));
scene.add(ambientPoints);

// ── Stage markers along the inner ring: tiny gold dots, no emoji ───────────
const stageGroups = [];
STAGES.forEach((stage, i) => {
  const group = new THREE.Group();
  const angle = (i / STAGES.length) * Math.PI * 2;

    new THREE.SphereGeometry(0.05, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xc9a84c, transparent: true, opacity: 0.85 })
  );
  group.add(dot);
  group.userData = { baseOpacity: 0.85, baseScale: 1 };
  scene.add(group);
  stageGroups.push(group);
});

// Faint dashed orbit through all 10 markers (gold)
const pathPoints = stageGroups.map((g) => g.position.clone());
const pathCurve = new THREE.CatmullRomCurve3(pathPoints);
const dashedPath = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(pathCurve.getPoints(120)),
  new THREE.LineDashedMaterial({
    color: 0xc9a84c, transparent: true, opacity: 0.18,
    dashSize: 0.18, gapSize: 0.22,
  })

dashedPath.computeLineDistances();
scene.add(dashedPath);
// ── Active marker: the gold dot that travels along the orbit during animation ──
const activeMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.13, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 })
);
// Soft radial-gradient texture so the halo is a glow, not a flat square
const _haloTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,235,180,1)');
  grd.addColorStop(0.35, 'rgba(201,168,76,0.6)');
  grd.addColorStop(1, 'rgba(201,168,76,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const activeHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: _haloTex, color: 0xc9a84c, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
activeHalo.scale.set(3.5, 3.5, 1);
activeMarker.add(activeHalo);
scene.add(activeMarker);

const flowStages = [];

function updateStageFlow() {

async function loadPromptHistory() {
  try {
    // Try to fetch real prompts from the overseer API
    const resp = await fetch('/api/overseer');
    const data = await resp.json();
    // Pull prompts from prompt_queue if available
    const queue = data.prompt_queue;
    const items = Array.isArray(queue) ? queue : (queue?.items || []);
    if (items.length > 0) {
      promptHistory = items.slice(0, 20).map(i =>
        (typeof i === 'string' ? i : (i.text || i.message || i.prompt || JSON.stringify(i)))
      ).filter(Boolean);
      populatePromptDropdown();
      // Auto-select the latest prompt
      if (promptHistory.length > 0 && promptSelectEl) {
        promptSelectEl.value = promptHistory.length - 1;
        selectedPrompt = promptHistory[promptSelectEl.value];
        selectedTransform = generateTransform(selectedPrompt);
        currentStage = 0;
        updateDisplay();
        updateStageFlow();
      }
      return;
    }
  } catch(e) {
    console.log('[pipeline] No prompt history from API:', e.message);
  }
  // Fallback: use sample prompts so the UI is never empty
  const samplePrompts = [
    "Analyze the security posture of our web application",
    "Write a business plan for a SaaS startup",
    "Investigate the network traffic patterns on subnet 10.0.0.0/24",
    "Create a comprehensive incident response plan",
    "Review this code for potential vulnerabilities",
  ];
  promptHistory = samplePrompts;
  populatePromptDropdown();
  // Auto-select so the animation shows content immediately
  if (promptHistory.length > 0 && promptSelectEl) {
    promptSelectEl.value = promptHistory.length - 1;
    selectedPrompt = promptHistory[promptSelectEl.value];
    selectedTransform = generateTransform(selectedPrompt);
    currentStage = 0;
    updateDisplay();
    updateStageFlow();
  }
}

function populatePromptDropdown() {
  promptSelectEl.innerHTML = '';
  promptHistory.forEach((prompt, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = prompt.substring(0, 50) + (prompt.length > 50 ? '...' : '');
    promptSelectEl.appendChild(opt);
  });
  promptSelectEl.addEventListener('change', () => {
    selectedPrompt = promptHistory[promptSelectEl.value];
    selectedTransform = generateTransform(selectedPrompt);
    currentStage = 0;
    updateDisplay();
    if (!isPlaying) updateStageFlow();
  });
}

// ── Sand-letter animation ─────────────────────────────────────────────────
// Each letter of the displayed prompt text is broken into a tiny DOM span.
// When the stage changes, those letters dissolve into drifting "sand" particles
// (small gold dots that swirl), then re-form as the new prompt's letters.
const SAND_PALETTE = ['#c9a84c', '#f0e0a8', '#a07a30', '#ffffff'];
const sandParticles = [];     // currently drifting particles
let sandHost = null;          // the host element being animated
let sandCurrentText = '';
let sandAnimating = false;
let sandReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function _sandRand(min, max) { return min + Math.random() * (max - min); }
function _sandColor() { return SAND_PALETTE[(Math.random() * SAND_PALETTE.length) | 0]; }

function _spawnSandParticle(host, x, y, intensity = 1) {
  const p = document.createElement('span');
  p.className = 'sand-particle';
  // Each particle is a 2-4px gold dot
  const sz = _sandRand(2.2, 3.6) * intensity;
  p.style.width = sz + 'px';
  p.style.height = sz + 'px';
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  p.style.background = _sandColor();
  p.style.boxShadow = `0 0 ${sz * 2}px ${_sandColor()}`;
  host.appendChild(p);
  // Lifetime motion: drift up + side + fade
  const dx = _sandRand(-120, 120);
  const dy = _sandRand(-180, -60);   // upward
  const dur = _sandRand(700, 1300);
  const start = performance.now();
  const vx = dx / dur * 1000;
  const vy = dy / dur * 1000;
  sandParticles.push({
    el: p, x, y, vx, vy,
    born: start, life: dur,
  });
}

function _sandTick() {
  if (!sandAnimating) return;
  const now = performance.now();
  for (let i = sandParticles.length - 1; i >= 0; i--) {
    const p = sandParticles[i];
    const t = (now - p.born) / p.life;
    if (t >= 1) {
      p.el.remove();
      sandParticles.splice(i, 1);
      continue;
    }
    // Slight gravity pulls back down + rotation for "sand in wind"
    const drag = 0.985;
    p.vx *= drag;
    p.vy = p.vy * drag + 0.18 * 16; // gentle gravity (px/frame at 60fps)
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${t * 360}deg)`;
    p.el.style.opacity = String(Math.max(0, 1 - t * 0.95));
  }
  if (sandParticles.length) requestAnimationFrame(_sandTick);
  else sandAnimating = false;
}

function _disintegrate(host) {
  if (!host) return;
  const rect = host.getBoundingClientRect();
  const hostRect = { left: rect.left, top: rect.top };
  const letters = host.querySelectorAll('.sand-letter');
  letters.forEach((l) => {
    const r = l.getBoundingClientRect();
    const cx = r.left - hostRect.left + r.width / 2;
    const cy = r.top - hostRect.top + r.height / 2;
    // Spawn 6-10 particles per letter
    const n = 6 + ((Math.random() * 4) | 0);
    for (let k = 0; k < n; k++) {
      _spawnSandParticle(host, cx + _sandRand(-4, 4), cy + _sandRand(-3, 3));
    }
    l.classList.add('dissolving');
  });
  sandAnimating = true;
  requestAnimationFrame(_sandTick);
}

function _buildLetters(host, text) {
  host.innerHTML = '';
  // Wrap text into .sand-letter spans for each character; spaces become thin gaps
  const frag = document.createDocumentFragment();
  for (const ch of text) {
    if (ch === '\n') {
      frag.appendChild(document.createElement('br'));
      continue;
    }
    if (ch === ' ') {
      const s = document.createElement('span');
      s.className = 'sand-space';
      s.innerHTML = '&nbsp;';
      frag.appendChild(s);
      continue;
    }
    const span = document.createElement('span');
    span.className = 'sand-letter';
    span.textContent = ch;
    frag.appendChild(span);
  }
  host.appendChild(frag);
}

function animateSandText(host, newText) {
  if (!host) return;
  if (newText === sandCurrentText && host.childElementCount > 0) {
    return; // no-op
  }
  sandHost = host;
  // If we had previous content, disintegrate it first; then build new letters.
  const hadPrev = host.querySelector('.sand-letter');
  const doBuild = () => _buildLetters(host, newText);
  if (hadPrev && !sandReducedMotion) {
    _disintegrate(host);
    setTimeout(doBuild, sandReducedMotion ? 0 : 280);
  } else {
    doBuild();
  }
  sandCurrentText = newText;
}

function generateTransform(prompt) {
  // Keys match STAGES[*].sub values — the lookup uses stage.sub directly.
  return {
    prompt_intake: prompt,
    frame_assemble: `[COMPOSE] Framed with policy · output reserved · request valid`,
    frame_of_ref: `[FRAME_OF_REF] Profile: CortexAgent · constraints: active · output contract: set`,
    memory_check: `[MEMORY_CHECK] Hot memory hit → 3 domains · savings pattern: 34% · confidence: 0.87`,
    slimtoken_minify: `[SLIMTOKEN] TOOLS→SYSTEM→MESSAGES→DEDUP→DISTILL→BUDGET\n"${prompt}"\n[SAVED: ${Math.floor(prompt.length / 4)} tokens · ~${Math.max(1, Math.floor(prompt.length / 12))}× compression]`,
    tool_routing: `[TOOL_ROUTING] → [PRIORITY: HIGH] → [MODEL: overseer] → build tool_calls`,
    context_fit: `[FINALIZE] valid ✅ · fits ✅ · schema_valid ✅ · template_applied ✅`,
    prefill: `[PREFILL] Model reading optimized prompt\ninput_tokens: 2,412 · input_tps: ~800`,
    decode: `[DECODE] Generating response token-by-token\noutput_tps: 42 · streaming…`,
    stream_out: `[DELIVER] Streamed via SSE\nstatus: success · total_tokens: 3,187`,
  };
}

function updateDisplay() {
  const stage = STAGES[currentStage];
  const transform = selectedTransform || {};
  const stageContent = transform[stage.sub] || selectedPrompt || '';

  const display = document.getElementById('stage-display');
  display.classList.remove('active');

  // Drive the right-side explainer — slide in when there's content, out otherwise
  if (selectedPrompt) {
    xNumEl.textContent = `Stage ${String(currentStage + 1).padStart(2, '0')} of ${String(STAGES.length).padStart(2, '0')}`;
    xTitleEl.textContent = stage.name.replace(/_/g, ' ');
    xSubEl.textContent = stage.sub.replace(/_/g, ' ');
    xBodyEl.innerHTML = stage.detail || `<p>${stage.desc}</p>`;
    xTokensEl.textContent = `~${stage.tokenEst.toLocaleString()}`;
    explainerEl.classList.add('active');
  } else {
    explainerEl.classList.remove('active');
  }

  setTimeout(() => {
    stageLabelEl.textContent = `Stage ${String(currentStage + 1).padStart(2, '0')} of ${String(STAGES.length).padStart(2, '0')}`;
    stageTitleEl.textContent = stage.name.replace(/_/g, ' ');
    stageTitleEl.style.color = stage.color;
    stageSubEl.textContent = stage.sub.replace(/_/g, ' ');

    // Center = literal prompt text ONLY, animated by the sand host
    const sandHost = document.getElementById('sand-host');
    if (sandHost) {
      const text = stageContent || '';
      animateSandText(sandHost, text);
    }

    display.classList.add('active');
  }, 300);

  transitionEl.classList.add('flash');
  setTimeout(() => transitionEl.classList.remove('flash'), 400);
  updateStageFlow();
  updateStageNodes();
}

function switchStage(index) {
  if (index < 0 || index >= STAGES.length) return;
  currentStage = index;
  updateDisplay();
}

function updateStageNodes() {
  // Tiny stage dots pulse subtly when active, dim when pending
  stageGroups.forEach((group, i) => {
    const dot = group.children[0];
    const isActive = i === currentStage;
    const scale = isActive ? (1.0 + Math.sin(performance.now() * 0.004) * 0.4) : 1.0;
    group.scale.setScalar(scale);
    dot.material.opacity = isActive ? 1.0 : (i < currentStage ? 0.55 : 0.25);
  });
}

btnPrev.addEventListener('click', () => switchStage(currentStage - 1));
btnNext.addEventListener('click', () => switchStage(currentStage + 1));

btnPlay.addEventListener('click', () => {
  isPlaying = !isPlaying;
  btnPlay.textContent = isPlaying ? '⏸' : '▶';
  btnPlay.classList.toggle('active', isPlaying);
  if (isPlaying) autoPlay();
  else clearTimeout(playTimeout);
});

function autoPlay() {
  if (!isPlaying) return;
  setTimeout(() => {
    if (!isPlaying) return;
    switchStage((currentStage + 1) % STAGES.length);
    autoPlay();
  }, 3000 / speed);
}

btnReset.addEventListener('click', () => {

  btnPlay.textContent = '▶';

// Fallback: force hide loader after 3 seconds
setTimeout(() => {
  const loader = document.getElementById('loader');
  if (loader && !loader.classList.contains('hidden')) {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 700);
  }
}, 3000);

function animate(now) {
  requestAnimationFrame(animate);
  const elapsed = now * 0.001;

  ambientPoints.rotation.y += 0.0008;
  const ap = ambientGeom.attributes.position.array;
  for (let i = 0; i < AMBIENT_COUNT; i++) {
    ap[i*3+1] += Math.sin(now * 0.001 + i) * 0.002;
  }
  ambientGeom.attributes.position.needsUpdate = true;

  // Stage dots stay anchored (no bobbing — calmer, more luxurious)

  // Rotate the central gyroscope rings — each on its own axis, in its own direction
  gyroRings.forEach((ring) => {
    const d = ring.userData;
    ring.rotation.z += d.speed;
    ring.rotation.x = d.tiltX + Math.sin(elapsed * 0.4) * 0.08;
  });

  // Active marker travels along the curve from one stage dot to the next.
  // It uses smooth interpolation for a luxurious flowing motion.
  if (selectedPrompt && STAGES.length > 1) {
    const seg = currentStage / (STAGES.length - 1);
    const pulse = Math.sin(now * 0.001 * Math.PI) * 0.5 + 0.5; // 0..1 over ~2s
    const pos = pathCurve.getPoint(seg);
    activeMarker.position.copy(pos);
    activeMarker.scale.setScalar(0.9 + pulse * 0.35);
  } else {
    // Idle: float the marker along the curve slowly
    const seg = (elapsed * 0.05) % 1;
    const pos = pathCurve.getPoint(seg);
    activeMarker.position.copy(pos);
    activeMarker.scale.setScalar(0.9 + Math.sin(elapsed * 1.5) * 0.15);
  }

  controls.update();
  renderer.render(scene, camera);
}

loadPromptHistory();
requestAnimationFrame(animate);

// Debug: log errors
window.addEventListener('error', (e) => console.error('Pipeline error:', e));
