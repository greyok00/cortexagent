<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Pipeline — the code in action</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;}
  #scene{position:fixed;inset:0;}
  /* Minimal speed slider — the one control the spec requires. Blends into the scene. */
  #speed{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:.6rem;font:300 .6rem/1 'Helvetica Neue',Arial,sans-serif;
    letter-spacing:.22em;text-transform:uppercase;color:#8a7d68;pointer-events:none;}
  #speed input{pointer-events:auto;width:9rem;accent-color:#c9a84c;background:transparent;cursor:pointer;}
  #speed .v{color:#c9a84c;min-width:2.2rem;text-align:right;}
</style>
</head>
<body>
<div id="scene"></div>
<div id="speed"><span>Speed</span><input id="speed-slider" type="range" min="0.4" max="3" step="0.1" value="1"><span class="v" id="speed-val">1.0×</span></div>

<script type="importmap">
{
  "imports": {
    "three": "/assets/vendor/three.module.min.js",
    "three/addons/": "/assets/vendor/addons/",
    "bidi-js": "/assets/vendor/troika/bidi.mjs",
    "troika-three-utils": "/assets/vendor/troika/troika-three-utils.esm.js",
    "troika-worker-utils": "/assets/vendor/troika/troika-worker-utils.esm.js",
    "webgl-sdf-generator": "/assets/vendor/troika/webgl-sdf-generator.mjs",
    "troika-three-text": "/assets/vendor/troika/troika-three-text.esm.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Text, configureTextBuilder } from 'troika-three-text';

/* Run typesetting on the main thread — air-gapped / CSP-safe (no worker fetch). */
configureTextBuilder({ useWorker: false });

/* ═══════════════════════════════════════════════════════════════════════
   THE PIPELINE — molten-gold journey (spec: WEBUI-3D-PIPELINE.md)
   A single molten-gold prompt entity travels a path through 6 stage
   landmarks, transforming at each. Camera-driven (dolly/arc per stage),
   NOT a strip. Pure 3D. UI only.
   ═══════════════════════════════════════════════════════════════════════ */

const STAGES = [
  { name:'PROMPT',        label:'RAW PROMPT',        color:0xffd98a, heat:0.30, scale:1.00, amp:0.35, freq:1.2, kw:'raw prompt' },
  { name:'SLIMTOKEN',     label:'MINIFY · COMPRESS', color:0xffc24a, heat:0.55, scale:0.70, amp:0.20, freq:1.6, kw:'compress · minify' },
  { name:'FRAME OF REF',  label:'REFRAME · BUSINESS', color:0xffa63a, heat:0.70, scale:0.85, amp:0.15, freq:2.5, kw:'reframe · business' },
  { name:'MEMORY CHECK',  label:'KEYWORDS FLASH',    color:0xff8a1a, heat:0.85, scale:0.90, amp:0.25, freq:1.8, kw:'keywords flash' },
  { name:'OVERSEER ROUTE',label:'ROUTE · MODEL',     color:0xff6a00, heat:1.00, scale:1.00, amp:0.20, freq:2.0, kw:'route · model' },
  { name:'GENERATE',      label:'FINAL ANSWER',      color:0xfff0c0, heat:1.20, scale:1.30, amp:0.30, freq:1.4, kw:'final answer' },
];

/* ── renderer: cinematic tone mapping ── */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.018);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 4, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.enablePan = false; controls.autoRotate = false;
controls.minDistance = 6; controls.maxDistance = 30;

/* ── post: RenderPass → UnrealBloomPass → OutputPass (real tooling) ── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.6, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ── environment map: metals are 100% reflection — this is the whole look ── */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* warm key light: metals are 100% reflection — this adds the molten sparkle */
scene.add(new THREE.PointLight(0xffb45a, 3, 0, 2).translateY(3));

/* ── Ashima 3D simplex noise (compact) ── */
const NOISE_GLSL = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i); vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*snoise(p); p*=2.02; a*=0.5; } return v*0.5+0.5; }
`;

/* ── the molten-gold prompt entity ──
   MeshPhysicalMaterial + onBeforeCompile displacement (keeps PBR reflections
   + tone mapping) + blackbody ramp injected into the fragment output.
   uNoiseAmp/uNoiseFreq drive the per-stage shape morph. */
const entityUniforms = { uTime:{value:0}, uHeat:{value:0.3}, uNoiseAmp:{value:0.35}, uNoiseFreq:{value:1.2} };
const entityMat = new THREE.MeshPhysicalMaterial({
  metalness:1.0, roughness:0.15, clearcoat:1.0, clearcoatRoughness:0.10,
  iridescence:0.45, envMapIntensity:1.4, color:0xffc24a,
});
entityMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = entityUniforms.uTime;
  shader.uniforms.uHeat = entityUniforms.uHeat;
  shader.uniforms.uNoiseAmp = entityUniforms.uNoiseAmp;
  shader.uniforms.uNoiseFreq = entityUniforms.uNoiseFreq;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>\n${NOISE_GLSL}\nuniform float uTime; uniform float uNoiseAmp; uniform float uNoiseFreq;`)
    .replace('#include <begin_vertex>',
      `#include <begin_vertex>\n transformed += normal * (snoise(position*uNoiseFreq + uTime*0.4) - 0.5) * uNoiseAmp;`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>\n${NOISE_GLSL}\nuniform float uTime; uniform float uHeat;`)
    .replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
      `vec3 vp = vViewPosition + position;
       float n = fbm(vp*1.1 + uTime*0.22);
       n = clamp(n + (uHeat-0.5)*0.5, 0.0, 1.0);
       vec3 white=vec3(1.0,0.95,0.80), gold=vec3(1.0,0.72,0.20),
            orange=vec3(0.85,0.25,0.05), dark=vec3(0.10,0.02,0.01);
       vec3 ramp = mix(mix(dark,orange,smoothstep(0.0,0.4,n)), mix(gold,white,smoothstep(0.6,1.0,n)), n);
       vec3 molten = mix(outgoingLight, ramp, 0.5) + ramp*0.95;
       gl_FragColor = vec4( molten, diffuseColor.a );`);
};
const entity = new THREE.Mesh(new THREE.SphereGeometry(1.0, 96, 96), entityMat);
scene.add(entity);

/* soft glow halo around the entity */
function softDot(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,240,200,1)'); grd.addColorStop(0.3,'rgba(255,190,110,0.5)');
  grd.addColorStop(0.7,'rgba(200,120,40,0.12)'); grd.addColorStop(1,'rgba(120,60,20,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const haloTex = softDot();
const entityHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map:haloTex, color:0xffb45a, transparent:true, opacity:0.6,
  blending:THREE.AdditiveBlending, depthWrite:false }));
entityHalo.scale.set(4.5,4.5,1);
entity.add(entityHalo);

/* ── 6 stage landmarks: identity + glow + halo ── */
const stageNodes = [];
const stagePoints = [];
const RING_R = 6.0;
STAGES.forEach((s, i) => {
  const a = (i/STAGES.length)*Math.PI*2 - Math.PI/2;
  const pos = new THREE.Vector3(Math.cos(a)*RING_R, 0, Math.sin(a)*RING_R);
  stagePoints.push(pos);
  const g = new THREE.Group();
  g.position.copy(pos);
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.10, 20, 20),
    new THREE.MeshBasicMaterial({ color:s.color, transparent:true, opacity:0.9 }));
  g.add(dot);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map:haloTex, color:s.color, transparent:true, opacity:0.35,
    blending:THREE.AdditiveBlending, depthWrite:false }));
  halo.scale.set(2.2,2.2,1);
  g.add(halo);
  scene.add(g);
  stageNodes.push({ group:g, dot, halo, stage:s });
});

/* faint dashed orbit through the landmarks */
const pathCurve = new THREE.CatmullRomCurve3(stagePoints, true, 'centripetal', 0.5);
const dashedPath = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(pathCurve.getPoints(160)),
  new THREE.LineDashedMaterial({ color:0xc9a84c, transparent:true, opacity:0.15,
    dashSize:0.2, gapSize:0.25 }));
dashedPath.computeLineDistances();
scene.add(dashedPath);

/* ── ember particles (additive, 1 draw call) ── */
const EMBERS = 3000;
const emberGeom = new THREE.BufferGeometry();
const ePos = new Float32Array(EMBERS*3), eVel = new Float32Array(EMBERS*3), eLife = new Float32Array(EMBERS);
for (let i=0;i<EMBERS;i++){ ePos[i*3]=0; ePos[i*3+1]=0; ePos[i*3+2]=0; eLife[i]=1; }
emberGeom.setAttribute('position', new THREE.BufferAttribute(ePos,3));
const emberMat = new THREE.PointsMaterial({
  map:haloTex, color:0xffa63a, size:0.12, transparent:true, opacity:0.8,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true });
const embers = new THREE.Points(emberGeom, emberMat);
scene.add(embers);
function spawnEmber(at, burst){
  for (let i=0;i<EMBERS;i++){
    if (eLife[i] < 1) continue;
    eLife[i]=0;
    ePos[i*3]=at.x; ePos[i*3+1]=at.y; ePos[i*3+2]=at.z;
    const k = burst ? 1 : 0.5;
    eVel[i*3]=(Math.random()-0.5)*4*k; eVel[i*3+1]=1.5+Math.random()*4*k; eVel[i*3+2]=(Math.random()-0.5)*4*k;
    return;
  }
}
function updateEmbers(dt){
  for (let i=0;i<EMBERS;i++){
    if (eLife[i]>=1) continue;
    eLife[i]+=dt*0.8;
    eVel[i*3+1]-=2.5*dt;
    ePos[i*3]+=eVel[i*3]*dt; ePos[i*3+1]+=eVel[i*3+1]*dt; ePos[i*3+2]+=eVel[i*3+2]*dt;
    if (eLife[i]>=1){ ePos[i*3+1]=-99; }
  }
  emberGeom.attributes.position.needsUpdate = true;
}

/* ── distant star field: depth + cinematic contrast (pure 3D Points) ── */
const STARS = 900;
const starPos = new Float32Array(STARS*3);
for (let i=0;i<STARS;i++){
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  const r = 45 + Math.random()*35;
  starPos[i*3]   = Math.sin(ph)*Math.cos(th)*r;
  starPos[i*3+1] = Math.sin(ph)*Math.sin(th)*r;
  starPos[i*3+2] = Math.cos(ph)*r;
}
const starGeom = new THREE.BufferGeometry();
starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  map:haloTex, color:0xd8e2ff, size:0.5, transparent:true, opacity:0.9,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true });
scene.add(new THREE.Points(starGeom, starMat));

/* ── in-scene SDF prompt text (troika-three-text, font bundled locally) ── */
const FONT_URL = '/assets/vendor/troika/LiberationSans-Bold.ttf';
function makeText(size, color){
  const t = new Text();
  t.font = FONT_URL;
  t.fontSize = size;
  t.color = color;
  t.anchorX = 'center';
  t.anchorY = 'middle';
  t.text = '';
  t.sync();
  return t;
}
const stageLabel = makeText(0.72, 0xffe6a8);
stageLabel.text = 'RAW PROMPT';
stageLabel.sync();
scene.add(stageLabel);

/* keyword flash texts (memory check) — pooled, shown around the entity */
const KEYWORDS = ['memory', 'context', 'retrieve', 'match', 'rank', 'recall'];
const kwTexts = KEYWORDS.map((w, i) => {
  const t = makeText(0.34, 0xffa63a);
  t.text = w;
  t.sync();
  t.visible = false;
  scene.add(t);
  return t;
});

/* stage index markers (01→06) — makes the ring read as a pipeline */
const stageIdx = [];
STAGES.forEach((s, i) => {
  const idx = makeText(0.26, 0x8a7d68);
  idx.text = String(i+1).padStart(2, '0');
  idx.sync();
  idx.position.set(0, -0.5, 0);
  stageNodes[i].group.add(idx);
  stageIdx.push(idx);
});

/* ── overseer-route satellites: small molten masses that fork off ── */
const satMat = new THREE.MeshPhysicalMaterial({
  metalness:1.0, roughness:0.2, clearcoat:1.0, clearcoatRoughness:0.15,
  envMapIntensity:1.2, color:0xff6a00, emissive:0xff6a00, emissiveIntensity:0.4 });
const satellites = [];
for (let i=0;i<3;i++){
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 24), satMat);
  m.visible = false;
  scene.add(m);
  satellites.push({ mesh:m, active:false, t:0, from:new THREE.Vector3(), to:new THREE.Vector3() });
}

/* ── cinematic drive: camera dollies to each stage; entity transforms ── */
let currentStage = 0;
let stageT = 0;            // 0..1 progress toward next stage
let speed = 1.0;
let labelOpacity = 1;
let labelTarget = 1;
let lastLabel = '';
const STAGE_HOLD = 4.0;    // seconds per stage at 1.0×
const camTarget = new THREE.Vector3();
const camLook = new THREE.Vector3();
let arcAngle = 0;

function setLabel(text, color){
  if (text === lastLabel) return;
  lastLabel = text;
  stageLabel.text = text;
  stageLabel.color = color;
  stageLabel.sync();
  labelTarget = 1;
  labelOpacity = 0;
  for (let b=0;b<10;b++) spawnEmber(entity.position, true);
}

function flashKeywords(){
  kwTexts.forEach((t, i) => {
    const a = (i/KEYWORDS.length)*Math.PI*2;
    t.position.copy(entity.position).add(new THREE.Vector3(Math.cos(a)*1.7, 0.4+Math.sin(i*1.7)*0.3, Math.sin(a)*1.7));
    t.visible = true;
    t.material.opacity = 0;
  });
}

function fork(){
  const next = stagePoints[(currentStage+1)%STAGES.length];
  satellites.forEach((s, i) => {
    s.active = true; s.t = 0;
    s.from.copy(entity.position);
    s.to.copy(next).add(new THREE.Vector3((i-1)*0.8, 0.5, 0));
    s.mesh.visible = true;
    s.mesh.position.copy(s.from);
  });
}

function setStage(i){
  currentStage = i;
  const s = STAGES[i];
  setLabel(s.label, s.color);
  for (let b=0;b<14;b++) spawnEmber(entity.position, true);
  const p = stagePoints[i];
  camTarget.set(p.x*0.7, 1.6, p.z*0.7 + 4.5);
  camLook.copy(p);
  arcAngle = 0;
  if (i === 3) flashKeywords();
  if (i === 4) fork();
}

function step(dt){
  stageT += dt * speed;
  if (stageT >= STAGE_HOLD){ stageT = 0; setStage((currentStage+1)%STAGES.length); }
  // entity follows the path (arc-length, uniform speed)
  const t = (currentStage + stageT/STAGE_HOLD) / STAGES.length;
  const pos = pathCurve.getPointAt(t % 1);
  entity.position.copy(pos);
  entity.lookAt(pos.clone().add(pathCurve.getTangentAt(t % 1)));
  // transform: ease toward current stage's heat / morph / scale
  const s = STAGES[currentStage];
  entityUniforms.uHeat.value += (s.heat - entityUniforms.uHeat.value)*0.08;
  entityUniforms.uNoiseAmp.value += (s.amp - entityUniforms.uNoiseAmp.value)*0.08;
  entityUniforms.uNoiseFreq.value += (s.freq - entityUniforms.uNoiseFreq.value)*0.08;
  const pulseFreq = busy ? 0.02 : 0.004;
  const pulse = 1 + Math.sin(performance.now()*pulseFreq)*(busy ? 0.09 : 0.05);
  const targetScale = s.scale * pulse;
  entity.scale.lerp(new THREE.Vector3(targetScale,targetScale,targetScale), 0.08);
  // camera dolly + slow arc during hold
  arcAngle += dt*0.15*speed;
  const arc = new THREE.Vector3(Math.cos(arcAngle)*0.6, 0, Math.sin(arcAngle)*0.6);
  camera.position.lerp(camTarget.clone().add(arc), 0.02);
  camera.lookAt(camLook);
  // label: billboard above entity, fade in/out
  labelOpacity += (labelTarget - labelOpacity)*0.06;
  stageLabel.material.opacity = labelOpacity;
  stageLabel.position.copy(entity.position).add(new THREE.Vector3(0, 3.0, 0));
  stageLabel.lookAt(camera.position);
  // keyword flash animation (memory check)
  kwTexts.forEach((t, i) => {
    if (!t.visible) return;
    const ph = (performance.now()*0.002 + i*0.4) % 1;
    t.material.opacity = Math.sin(ph*Math.PI);
    t.scale.setScalar(1 + Math.sin(ph*Math.PI)*0.3);
    const a = (i/KEYWORDS.length)*Math.PI*2;
    t.position.copy(entity.position).add(new THREE.Vector3(Math.cos(a)*1.7, 0.4+Math.sin(i*1.7)*0.3, Math.sin(a)*1.7));
    t.lookAt(camera.position);
    if (ph > 0.95) t.visible = false;
  });
  // satellites fly off
  satellites.forEach((s) => {
    if (!s.active) return;
    s.t += dt*0.6*speed;
    if (s.t >= 1){ s.active=false; s.mesh.visible=false; return; }
    s.mesh.position.lerpVectors(s.from, s.to, s.t);
    s.mesh.scale.setScalar(1 - s.t*0.6);
  });
  // stage node pulse + billboard index markers
  stageNodes.forEach((n, i) => {
    const active = i === currentStage;
    const sc = active ? (1 + Math.sin(performance.now()*0.006)*0.3) : 1;
    n.group.scale.setScalar(sc);
    n.halo.material.opacity = active ? 0.6 : 0.25;
  });
  stageIdx.forEach((t) => { t.lookAt(camera.position); });
  // live-when-busy: emit a trickle of embers matching the real generation rate
  if (busy && Math.random() < liveTps*0.02) spawnEmber(entity.position, false);
}

/* ── render loop ── */
const clock = new THREE.Clock();
let _last = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now-_last)/1000, 0.05); _last = now;
  entityUniforms.uTime.value = clock.elapsedTime;
  step(dt);
  updateEmbers(dt);
  bloom.strength = 1.15 + entityUniforms.uHeat.value*0.45
                 + (busy ? Math.min(liveTps*0.03, 0.5) : 0);
  controls.update();
  composer.render();
}

/* ── speed slider ── */
const slider = document.getElementById('speed-slider');
const sval = document.getElementById('speed-val');
slider.addEventListener('input', () => { speed = parseFloat(slider.value); sval.textContent = speed.toFixed(1)+'×'; });

/* ── live-when-busy / cinematic-when-idle (poll :8090/live/tps) ──
   Reflects real pipeline activity when the engine is generating; falls back
   to the calm scripted journey when idle or when the feed is unreachable. */
let liveTps = 0, busy = false;
function pollLive(){
  fetch('/live/tps', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d){ busy = false; liveTps = 0; return; }
      const tps = d.current_tok_s || 0;
      const inTps = d.current_in_tps || 0;
      busy = (tps > 0.5) || (inTps > 120);
      liveTps = tps;
    })
    .catch(() => { busy = false; liveTps = 0; });
}
pollLive();
setInterval(pollLive, 2000);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ── headless test hook ── */
window.__pipeline = {
  stageCount: STAGES.length,
  stageNames: STAGES.map(s=>s.name),
  hasEntity: !!entity, hasPath: !!pathCurve, hasEmbers: EMBERS,
  hasOutputPass: true, hasTroika: !!stageLabel,
  currentStage: () => currentStage,
  entityPos: () => entity.position.toArray().map(n=>+n.toFixed(2)),
  heat: () => +entityUniforms.uHeat.value.toFixed(2),
  scale: () => +entity.scale.x.toFixed(2),
  label: () => stageLabel.text,
  live: () => ({ busy, liveTps: +liveTps.toFixed(1) }),
  jumpTo: (i) => setStage(i % STAGES.length),
  gl: () => { composer.render(); return renderer; },
  // Deterministic state-machine driver: advances the pipeline by `dt` seconds
  // (default 0.05 = one 60fps frame). Independent of requestAnimationFrame,
  // which headless/backgrounded tabs throttle to 0. Lets the full journey
  // (stage advance, heat ramp, path motion, embers) be verified via JS alone.
  tick: (dt=0.05) => { step(dt); updateEmbers(dt); composer.render(); },
};

setStage(0);
animate();
window.addEventListener('error', (e) => console.error('Pipeline error:', e));
</script>
</body>
