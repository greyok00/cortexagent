<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortexAgent — UI 3: Vertical Timeline</title>
<style>
  :root { --bg:#0a0e1a; --panel:#131826; --text:#e6e9f0; --unknown:#94a3b8;
          --accent:#38bdf8; --accent-dim:#1f3a4d; --ok:#4ade80;
          --warn:#fbbf24; --fail:#f87171; --border:#2a3142; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
         font-size:14px; min-height:100vh; }
  .tabs { display:flex; gap:4px; padding:12px 20px;
          border-bottom:1px solid var(--border); overflow-x:auto; }
  .tabs a { color:var(--unknown); text-decoration:none; padding:6px 10px;
            font-size:11px; border-radius:6px; border:1px solid transparent;
            white-space:nowrap; }
  .tabs a:hover { color:var(--text); border-color:var(--border); }
  .tabs a.active { color:var(--accent); border-color:var(--accent-dim);
                    background:rgba(56,189,248,0.06); }
  .tabs a.home { color:var(--warn); }

  main { max-width:740px; margin:0 auto; padding:32px 24px 64px; }

  /* Hardening pinned as banner at top */
  .banner { display:flex; gap:14px; padding:14px 18px; background:var(--panel);
            border:1px solid var(--border); border-radius:12px; margin-bottom:32px;
            align-items:center; flex-wrap:wrap; }
  .banner .ttl { color:var(--accent); font-size:13px;
                  letter-spacing:0.04em; margin-right:auto; }
  .chip { padding:3px 9px; border-radius:12px; font-size:11px;
          font-weight:600; display:inline-flex; align-items:center; gap:4px; }
  .chip .dot { width:6px; height:6px; border-radius:50%; }
  .chip.ok .dot { background:var(--ok); }
  .chip.warn { background:rgba(251,191,36,0.15); color:var(--warn);
               border:1px solid var(--warn); }
  .chip.warn .dot { background:var(--warn); }
  .chip.fail { background:rgba(248,113,113,0.15); color:var(--fail);
               border:1px solid var(--fail); }
  .chip.fail .dot { background:var(--fail); }
  .chip.ok { background:rgba(74,222,128,0.15); color:var(--ok);
             border:1px solid var(--ok); }

  /* Vertical line + nodes */
  .timeline { position:relative; padding-left:32px; }
  .timeline::before { content:""; position:absolute; left:11px; top:8px; bottom:8px;
                      width:2px; background:var(--border); }

  .event { position:relative; margin:0 0 20px 0;
           background:var(--panel); border:1px solid var(--border);
           border-radius:10px; padding:14px 18px; cursor:pointer;
           transition:border-color 150ms; }
  .event:hover { border-color:var(--accent-dim); }
  /* dot on the line */
  .event::before { content:""; position:absolute; left:-26px; top:18px;
                   width:14px; height:14px; border-radius:50%;
                   background:var(--bg); border:3px solid var(--accent); }
  .event.crit::before  { border-color:var(--fail); }
  .event.high::before  { border-color:var(--warn); }
  .event.info::before  { border-color:var(--accent); }
  .event.soar::before  { border-color:var(--ok); box-shadow:0 0 12px var(--ok); }

  .event .ts { color:var(--unknown); font-size:11px;
               letter-spacing:0.04em; }
  .event h3 { color:var(--text); margin:4px 0 6px 0; font-size:14px;
              font-weight:600; }
  .event .body { color:var(--unknown); font-size:12px; line-height:1.6; }
  .pill { padding:2px 8px; border-radius:12px; font-size:10px;
          font-weight:600; color:#000; }
  .pill.critical { background:var(--fail); }
  .pill.high { background:var(--warn); }
  .pill.medium { background:#fb923c; }
  .pill.low { background:var(--ok); }
  .pill.ok { background:var(--ok); }
  .pill.warn { background:var(--warn); }
  .pill.fail { background:var(--fail); }

  .stamp { float:right; }

  /* Pipeline inline marker strip */
  .pipe-strip { display:flex; gap:3px; align-items:center; margin-top:10px;
                font-size:9px; flex-wrap:wrap; }
  .pipe-strip .step { padding:2px 6px; border-radius:3px;
                       background:var(--bg); color:var(--unknown);
                       border:1px solid var(--border); }
  .pipe-strip .step.here { color:var(--text); border-color:var(--accent-dim);
                            background:rgba(56,189,248,0.05); }

  .legend { color:var(--unknown); font-size:11px; margin-top:32px;
            text-align:center; }
</style>
</head>
<body>

<nav class="tabs">
  <a href="../ui-mockup.html" class="home">v0.1 grid</a>
  <a href="ui-1.html">1 · command</a>
  <a href="ui-2.html">2 · orbit</a>
  <a href="ui-3.html" class="active">3 · timeline</a>
  <a href="ui-4.html">4 · cards</a>
  <a href="ui-5.html">5 · sidebar</a>
  <a href="ui-6.html">6 · bento</a>
  <a href="ui-7.html">7 · tree</a>
  <a href="ui-8.html">8 · hud</a>
</nav>

<main>

  <div class="banner">
    <div class="ttl">HARDENING</div>
    <span class="chip ok"><span class="dot"></span>capabilities</span>
    <span class="chip ok"><span class="dot"></span>dns_blocklist</span>
    <span class="chip ok"><span class="dot"></span>dnsmasq</span>
    <span class="chip ok"><span class="dot"></span>lsms</span>
    <span class="chip ok"><span class="dot"></span>apparmor</span>
    <span class="chip warn"><span class="dot"></span>auditd</span>
    <span class="chip fail"><span class="dot"></span>nftables</span>
  </div>

  <div class="timeline" id="tl"></div>

  <div class="legend">
    newest at top · oldest at bottom · click any event to inspect
  </div>

</main>

<script>
  // Reverse-chronological feed of events
  const EVENTS = [
    {ts:'2026-08-19 02:11', kind:'soar', cls:'soar',
     title:'SOAR · pb.fw.port-scan.isolate',
     body:'isolated host A · playbook completed', pip:5},
    {ts:'2026-08-19 01:47', kind:'soar', cls:'soar',
     title:'SOAR · pb.cve.triage',
     body:'3 low CVEs triaged', pip:6},
    {ts:'2026-08-19 01:22', kind:'finding', cls:'crit', sev:'critical', pill:'CRITICAL',
     title:'finding #22 · port-scan 192.168.99.42',
     body:'12 distinct ports (22, 23, 25, 80, 110, 143, 443, 3306, 3389, 5432) — INTERNAL source. tagged expected-internal-scanner.', pip:3},
    {ts:'2026-08-19 00:30', kind:'finding', cls:'high', sev:'high', pill:'HIGH',
     title:'finding #12 · port-scan 1.2.3.4',
     body:'12 ports · external source', pip:2},
    {ts:'2026-08-18 23:04', kind:'finding', cls:'high', sev:'high', pill:'HIGH',
     title:'finding #32 · kernel tainted 12801',
     body:'nvidia proprietary + cpu erratum workaround + modprobe --force history. No out-of-tree or unsigned modules loaded.', pip:8},
    {ts:'2026-08-18 18:30', kind:'finding', cls:'high', sev:'high', pill:'HIGH',
     title:'finding #3 · rkhunter warning',
     body:'1 warning flagged by rkhunter scan', pip:4},
    {ts:'2026-08-18 12:00', kind:'finding', cls:'high', sev:'high', pill:'HIGH',
     title:'finding #91 · kernel tainted 12801',
     body:'duplicate from hourly scan', pip:9},
    {ts:'2026-08-17 09:00', kind:'finding', cls:'high', sev:'high', pill:'HIGH',
     title:'finding #13 · rkhunter warning',
     body:'1 warning flagged by rkhunter scan', pip:4},
  ];

  const STAGES = ['COLLECT','COMPOSE','FRAME_OF_REF','MEMORY_CHECK','SLIMTOKEN','TOOL_ROUTING','FINALIZE','PREFILL','DECODE','DELIVER'];

  const tl = document.getElementById('tl');
  EVENTS.forEach(ev => {
    const e = document.createElement('div');
    e.className = `event ${ev.cls}`;
    const pipHere = Math.max(0, Math.min(STAGES.length-1, ev.pip || 0));
    const strip = STAGES.map((s,i) =>
      `<span class="step ${i===pipHere?'here':''}">${s}</span>`).join('');
    e.innerHTML = `
      <span class="pill ${ev.sev||ev.cls} stamp">${ev.pill||'INFO'}</span>
      <div class="ts">${ev.ts}</div>
      <h3>${ev.title}</h3>
      <div class="body">${ev.body}</div>
      <div class="pipe-strip">pipeline @ ${STAGES[pipHere]}: ${strip}</div>`;
    tl.appendChild(e);
  });
</script>

</body>
</html>
