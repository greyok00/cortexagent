<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortexAgent — UI 2: Radial Orbit</title>
<style>
  :root { --bg:#0a0e1a; --panel:#131826; --text:#e6e9f0; --unknown:#94a3b8;
          --accent:#38bdf8; --accent-dim:#1f3a4d; --ok:#4ade80;
          --warn:#fbbf24; --fail:#f87171; --border:#2a3142; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at center,
            #0d1325 0%, #0a0e1a 70%); color:var(--text);
         font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
         font-size:14px; min-height:100vh; }
  .tabs { display:flex; gap:4px; padding:12px 20px;
          border-bottom:1px solid var(--border); overflow-x:auto; }
  .tabs a { color:var(--unknown); text-decoration:none; padding:6px 10px;
            font-size:11px; border-radius:6px; border:1px solid transparent;
            white-space:nowrap; }
  .tabs a:hover { color:var(--text); border-color:var(--border); }
  .tabs a.active { color:var(--accent); border-color:var(--accent-dim);
                    background:rgba(56,189,248,0.06); }
  .tabs a.home { color:var(--warn); }

  main { display:grid; grid-template-columns: 1fr 360px;
         gap:24px; padding:32px; max-width:1400px; margin:0 auto; }
  @media (max-width:900px) { main { grid-template-columns: 1fr; } }

  .stage { position:relative; height:600px; border:1px solid var(--border);
           border-radius:50%; background:rgba(19,24,38,0.4); }
  .center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
           text-align:center; }
  .center .num { font-size:64px; color:var(--text); font-weight:700; line-height:1; }
  .center .lbl { color:var(--unknown); font-size:11px;
                 letter-spacing:0.12em; text-transform:uppercase; margin-top:6px; }
  .center .sub { color:var(--accent); font-size:11px; margin-top:4px; }

  /* Hardening nodes orbit the center */
  .node { position:absolute; top:50%; left:50%;
          width:84px; height:84px; margin:-42px 0 0 -42px;
          border-radius:50%; background:var(--panel);
          border:2px solid var(--border); display:flex;
          align-items:center; justify-content:center;
          flex-direction:column; cursor:pointer; transition:all 200ms;
          text-align:center; padding:6px; }
  .node:hover, .node.sel { transform: scale(1.15);
                            border-color:var(--accent); z-index:5; }
  .node .nm { font-size:11px; font-weight:600; color:var(--text);
              letter-spacing:0.04em; }
  .node .st { display:inline-block; width:8px; height:8px;
              border-radius:50%; margin-top:4px; }
  .node.ok .st { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .node.warn .st { background:var(--warn); box-shadow:0 0 8px var(--warn); }
  .node.fail .st { background:var(--fail); box-shadow:0 0 8px var(--fail); }

  /* Inner ring showing SIEM numbers */
  .ring { position:absolute; top:50%; left:50%;
          border-radius:50%; border:1px dashed var(--border);
          transform:translate(-50%,-50%); pointer-events:none; }
  .ring.outer { width:520px; height:520px; margin:-260px 0 0 -260px; }
  .ring.inner { width:280px; height:280px; margin:-140px 0 0 -140px;
                border-color:var(--accent-dim); }

  /* Right panel: detail */
  aside { background:var(--panel); border:1px solid var(--border);
          border-radius:14px; padding:24px; align-self:start; }
  aside h2 { color:var(--accent); margin:0 0 12px 0; font-size:16px; }
  aside .row { padding:6px 0; border-bottom:1px solid var(--border);
               display:flex; justify-content:space-between; font-size:12px; }
  aside .row:last-child { border:none; }
  aside .k { color:var(--unknown); }
  .pill { padding:2px 8px; border-radius:12px; font-size:10px;
          font-weight:600; color:#000; }
  .pill.ok { background:var(--ok); } .pill.warn { background:var(--warn); }
  .pill.fail { background:var(--fail); } .pill.critical { background:var(--fail); }
  .pill.high { background:var(--warn); }

  .legend { position:absolute; bottom:8px; left:0; right:0;
            display:flex; justify-content:center; gap:16px;
            font-size:10px; color:var(--unknown); }
  .legend span::before { content:""; display:inline-block; width:8px;
            height:8px; border-radius:50%; margin-right:4px; }
  .legend .o::before { background:var(--ok); }
  .legend .w::before { background:var(--warn); }
  .legend .f::before { background:var(--fail); }
</style>
</head>
<body>

<nav class="tabs">
  <a href="../ui-mockup.html" class="home">v0.1 grid</a>
  <a href="ui-1.html">1 · command</a>
  <a href="ui-2.html" class="active">2 · orbit</a>
  <a href="ui-3.html">3 · timeline</a>
  <a href="ui-4.html">4 · cards</a>
  <a href="ui-5.html">5 · sidebar</a>
  <a href="ui-6.html">6 · bento</a>
  <a href="ui-7.html">7 · tree</a>
  <a href="ui-8.html">8 · hud</a>
</nav>

<main>
  <section class="stage">
    <div class="ring outer"></div>
    <div class="ring inner"></div>
    <div class="center">
      <div class="num">12</div>
      <div class="lbl">SIEM · findings</div>
      <div class="sub">7 subsystems · 2 SOAR</div>
    </div>
    <!-- 7 hardening nodes placed via JS around the inner ring -->
    <div class="legend">
      <span class="o">ok</span><span class="w">warn</span><span class="f">fail</span>
    </div>
  </section>

  <aside id="aside">
    <h2>auditd</h2>
    <div class="row"><span class="k">posture</span><span class="pill warn">WARN</span></div>
    <div class="row"><span class="k">detail</span><span>2 rules failed to load</span></div>
    <div class="row"><span class="k">probe</span><span>:8093/api/hardening/auditd</span></div>
    <div class="row"><span class="k">actions</span><span>re-run · view log</span></div>
  </aside>
</main>

<script>
  const SUBS = [
    {name:'auditd',        s:'warn', note:'2 rules failed to load'},
    {name:'capabilities',  s:'ok',   note:'0 risky caps'},
    {name:'dns_blocklist', s:'ok',   note:'98 062 entries'},
    {name:'dnsmasq',       s:'ok',   note:'resolv→127.0.0.1'},
    {name:'lsms',          s:'ok',   note:'7 active'},
    {name:'nftables',      s:'fail', note:'needs root'},
    {name:'apparmor',      s:'ok',   note:'profiles loaded'},
  ];
  const stage = document.querySelector('.stage');
  const aside = document.getElementById('aside');
  // Position 7 nodes around the center, radius 200px
  SUBS.forEach((sub, i) => {
    const angle = (i / SUBS.length) * Math.PI * 2 - Math.PI / 2;
    const r = 200;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    const node = document.createElement('div');
    node.className = `node ${sub.s}`;
    node.style.transform = `translate(${x}px, ${y}px)`;
    node.innerHTML = `<div class="nm">${sub.name}</div><span class="st"></span>`;
    node.addEventListener('click', () => {
      document.querySelectorAll('.node').forEach(n => n.classList.remove('sel'));
      node.classList.add('sel');
      const cls = sub.s.toUpperCase();
      aside.innerHTML = `
        <h2>${sub.name}</h2>
        <div class="row"><span class="k">posture</span><span class="pill ${sub.s}">${cls}</span></div>
        <div class="row"><span class="k">detail</span><span>${sub.note}</span></div>
        <div class="row"><span class="k">probe</span><span>:8093/api/hardening/${sub.name}</span></div>
        <div class="row"><span class="k">actions</span><span>re-run · view log</span></div>`;
    });
    stage.appendChild(node);
  });
</script>

</body>
</html>
