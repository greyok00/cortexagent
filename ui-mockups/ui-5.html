<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortexAgent — UI 5: Sidebar + Workspace</title>
<style>
  :root { --bg:#0a0e1a; --panel:#131826; --text:#e6e9f0; --unknown:#94a3b8;
          --accent:#38bdf8; --accent-dim:#1f3a4d; --ok:#4ade80;
          --warn:#fbbf24; --fail:#f87171; --border:#2a3142; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
         font-size:14px; min-height:100vh; display:flex; flex-direction:column; }
  .tabs { display:flex; gap:4px; padding:12px 20px;
          border-bottom:1px solid var(--border); overflow-x:auto; }
  .tabs a { color:var(--unknown); text-decoration:none; padding:6px 10px;
            font-size:11px; border-radius:6px; border:1px solid transparent;
            white-space:nowrap; }
  .tabs a:hover { color:var(--text); border-color:var(--border); }
  .tabs a.active { color:var(--accent); border-color:var(--accent-dim);
                    background:rgba(56,189,248,0.06); }
  .tabs a.home { color:var(--warn); }

  /* App shell */
  .app { display:grid; grid-template-columns:240px 1fr;
         min-height:calc(100vh - 50px); }
  .side { background:var(--panel); border-right:1px solid var(--border);
          padding:20px 12px; }
  .side h2 { color:var(--accent); font-size:11px; letter-spacing:0.16em;
             text-transform:uppercase; margin:0 0 12px 8px; }
  .nav-item { display:flex; align-items:center; justify-content:space-between;
              padding:9px 12px; margin:2px 0; border-radius:8px;
              color:var(--unknown); cursor:pointer; font-size:13px;
              border:1px solid transparent; }
  .nav-item:hover { color:var(--text); background:rgba(56,189,248,0.04); }
  .nav-item.sel { color:var(--accent); border-color:var(--accent-dim);
                  background:rgba(56,189,248,0.08); }
  .nav-item .badge { background:var(--panel); color:var(--unknown);
                     font-size:10px; padding:2px 6px; border-radius:6px;
                     border:1px solid var(--border); }
  .nav-item.sel .badge { color:var(--accent); border-color:var(--accent-dim); }

  .side-foot { margin-top:30px; padding:14px 12px; border-top:1px solid var(--border);
               font-size:11px; color:var(--unknown); }
  .alive { color:var(--ok); }

  /* Workspace area */
  .work { padding:48px 64px; max-width:1100px; }
  .wlabel { color:var(--accent); font-size:11px; letter-spacing:0.16em;
            text-transform:uppercase; }
  .wtitle { font-size:32px; color:var(--text); margin:6px 0 4px 0;
            font-weight:600; }
  .wsub { color:var(--unknown); margin-bottom:36px; font-size:14px; }

  /* Big breathing content - one section fills the page */
  .stage { display:flex; flex-wrap:wrap; gap:18px; margin-bottom:36px; }
  .cell { background:var(--panel); border:1px solid var(--border);
          border-radius:12px; padding:18px 22px; min-width:200px; flex:1; }
  .cell .ttl { color:var(--unknown); font-size:10px;
               letter-spacing:0.12em; text-transform:uppercase;
               margin-bottom:6px; }
  .cell .v { font-size:28px; font-weight:600; color:var(--text); }
  .pill { padding:2px 8px; border-radius:12px; font-size:10px;
          font-weight:600; color:#000; }
  .pill.ok { background:var(--ok); } .pill.warn { background:var(--warn); }
  .pill.fail { background:var(--fail); }
  .pill.critical { background:var(--fail); }
  .pill.high { background:var(--warn); }
  .pill.medium { background:#fb923c; } .pill.low { background:var(--ok); }

  /* Lists in the workspace */
  ul.plain { list-style:none; padding:0; margin:0; }
  ul.plain li { padding:12px 0; border-bottom:1px solid var(--border);
                font-size:13px; display:flex; justify-content:space-between; }
  ul.plain li:last-child { border-bottom:none; }
  ul.plain li .nm { color:var(--text); }
  ul.plain li .note { color:var(--unknown); font-size:11px; }
  ul.plain li .stamp { color:var(--unknown); font-size:11px; }

  /* Pipeline strip */
  .pipe { display:flex; gap:6px; flex-wrap:wrap; }
  .pstep { padding:6px 12px; border:1px solid var(--border);
           background:var(--panel); border-radius:14px;
           font-size:11px; }
  .pstep .dot { display:inline-block; width:8px; height:8px;
                border-radius:50%; margin-right:6px;
                vertical-align:middle; }

  /* Empty state */
  .check-large { font-size:64px; color:var(--ok); margin:24px 0 8px;
                 text-align:center; }
  .check-large-msg { color:var(--text); text-align:center; font-size:18px;
                     margin-bottom:32px; }
</style>
</head>
<body>

<nav class="tabs">
  <a href="../ui-mockup.html" class="home">v0.1 grid</a>
  <a href="ui-1.html">1 · command</a>
  <a href="ui-2.html">2 · orbit</a>
  <a href="ui-3.html">3 · timeline</a>
  <a href="ui-4.html">4 · cards</a>
  <a href="ui-5.html" class="active">5 · sidebar</a>
  <a href="ui-6.html">6 · bento</a>
  <a href="ui-7.html">7 · tree</a>
  <a href="ui-8.html">8 · hud</a>
</nav>

<div class="app">
  <aside class="side">
    <h2>Workspace</h2>
    <div class="nav-item sel" data-view="hardening">Hardening <span class="badge">7</span></div>
    <div class="nav-item" data-view="siem">SIEM <span class="badge">12</span></div>
    <div class="nav-item" data-view="cve">CVE Feed <span class="badge">3</span></div>
    <div class="nav-item" data-view="soar">SOAR <span class="badge">2</span></div>
    <div class="nav-item" data-view="pipeline">Pipeline <span class="badge">10</span></div>
    <div class="nav-item" data-view="services">Services <span class="badge">5</span></div>
    <div class="side-foot">
      cortexagent.service <span class="alive">● alive</span><br>
      siem.db · 12 rows<br>
      audit last: 01:22 ago
    </div>
  </aside>

  <main class="work" id="work"></main>
</div>

<script>
  const VIEWS = {
    hardening: () => `
      <div class="wlabel">hardening</div>
      <h1 class="wtitle">Posture</h1>
      <p class="wsub">7 subsystems · live-probed at :8093/api/hardening/status</p>
      <ul class="plain">
        <li><div><span class="nm">auditd</span><div class="note">2 rules failed to load</div></div><span class="pill warn">WARN</span></li>
        <li><div><span class="nm">capabilities</span><div class="note">0 risky caps</div></div><span class="pill ok">OK</span></li>
        <li><div><span class="nm">dns_blocklist</span><div class="note">98 062 entries</div></div><span class="pill ok">OK</span></li>
        <li><div><span class="nm">dnsmasq</span><div class="note">resolv→127.0.0.1</div></div><span class="pill ok">OK</span></li>
        <li><div><span class="nm">lsms</span><div class="note">7 active (lockdown, capability, landlock, yama, apparmor, tomoyo, bpf)</div></div><span class="pill ok">OK</span></li>
        <li><div><span class="nm">nftables</span><div class="note">needs root to enumerate rules</div></div><span class="pill fail">FAIL</span></li>
        <li><div><span class="nm">apparmor</span><div class="note">profiles loaded</div></div><span class="pill ok">OK</span></li>
      </ul>`,

    siem: () => `
      <div class="wlabel">siem</div>
      <h1 class="wtitle">12 findings</h1>
      <p class="wsub">post-cleanup · 10 scan / 2 firewall · 1 critical / 11 high</p>
      <div class="stage">
        <div class="cell"><div class="ttl">total</div><div class="v">12</div></div>
        <div class="cell"><div class="ttl">critical</div><div class="v" style="color:var(--fail)">1</div></div>
        <div class="cell"><div class="ttl">high</div><div class="v" style="color:var(--warn)">11</div></div>
        <div class="cell"><div class="ttl">scan</div><div class="v">10</div></div>
        <div class="cell"><div class="ttl">firewall</div><div class="v">2</div></div>
      </div>
      <ul class="plain">
        <li><span class="nm">#22 port-scan 192.168.99.42</span><span><span class="stamp">firewall · internal</span> &nbsp; <span class="pill critical">CRIT</span></span></li>
        <li><span class="nm">#12 port-scan 1.2.3.4</span><span><span class="stamp">firewall · external</span> &nbsp; <span class="pill high">HIGH</span></span></li>
        <li><span class="nm">#3 / #13 / #23 rkhunter warning</span><span><span class="stamp">scan · rkhunter</span> &nbsp; <span class="pill high">HIGH</span></span></li>
        <li><span class="nm">#32/33/35/36/38/39/91 kernel tainted 12801</span><span><span class="stamp">scan · nvidia+errata+forced</span> &nbsp; <span class="pill high">HIGH</span></span></li>
      </ul>`,

    cve: () => `
      <div class="wlabel">cve feed</div>
      <h1 class="wtitle">Recent · last 7 days</h1>
      <p class="wsub">0 critical · 0 high · 1 medium · 2 low</p>
      <div class="check-large">✓</div>
      <div class="check-large-msg">no criticals this week</div>
      <ul class="plain">
        <li><span class="nm"><code>CVE-2026-1234</code> doas — env leak</span><span class="pill medium">MED</span></li>
        <li><span class="nm"><code>CVE-2026-1192</code> curl — cookie path</span><span class="pill low">LOW</span></li>
        <li><span class="nm"><code>CVE-2026-1144</code> readline — brackpaste</span><span class="pill low">LOW</span></li>
      </ul>`,

    soar: () => `
      <div class="wlabel">soar</div>
      <h1 class="wtitle">Playbook Runs</h1>
      <p class="wsub">last 24h · 2 runs · both logged-only</p>
      <ul class="plain">
        <li>
          <div><span class="nm">pb.fw.port-scan.isolate</span>
               <div class="stamp">2026-08-19 02:11:23 -0700</div></div>
          <span class="pill ok">OK</span>
        </li>
        <li>
          <div><span class="nm">pb.cve.triage</span>
               <div class="stamp">2026-08-19 01:47:08 -0700</div></div>
          <span class="pill ok">OK</span>
        </li>
      </ul>`,

    pipeline: () => `
      <div class="wlabel">pipeline</div>
      <h1 class="wtitle">Token Pipeline — 10 stages</h1>
      <p class="wsub">COLLECT → DELIVER (Tokyo-night palette).
         Full 3D scene lives at <code>:8090/pipeline</code></p>
      <div class="pipe">
        <span class="pstep"><span class="dot" style="background:#7AA2F7"></span>COLLECT</span>
        <span class="pstep"><span class="dot" style="background:#9ECE6A"></span>COMPOSE</span>
        <span class="pstep"><span class="dot" style="background:#BB9AF3"></span>FRAME_OF_REF</span>
        <span class="pstep"><span class="dot" style="background:#E0AF68"></span>MEMORY_CHECK</span>
        <span class="pstep"><span class="dot" style="background:#C9A84C"></span>SLIMTOKEN</span>
        <span class="pstep"><span class="dot" style="background:#7FD4C9"></span>TOOL_ROUTING</span>
        <span class="pstep"><span class="dot" style="background:#9ECE6A"></span>FINALIZE</span>
        <span class="pstep"><span class="dot" style="background:#7AA2F7"></span>PREFILL</span>
        <span class="pstep"><span class="dot" style="background:#F7768E"></span>DECODE</span>
        <span class="pstep"><span class="dot" style="background:#C9A84C"></span>DELIVER</span>
      </div>`,

    services: () => `
      <div class="wlabel">services</div>
      <h1 class="wtitle">Live Daemons</h1>
      <p class="wsub">systemd user units · 5 alive</p>
      <ul class="plain">
        <li><span class="nm">cortexagent.service</span><span class="pill ok">alive · 12h 14m</span></li>
        <li><span class="nm">cortexagent-overseer.service</span><span class="pill ok">alive · 12h 14m</span></li>
        <li><span class="nm">siem-console.service</span><span class="pill ok">:9998</span></li>
        <li><span class="nm">canary-server.service</span><span class="pill ok">:8092</span></li>
        <li><span class="nm">cortexagent-tray.service</span><span class="pill ok">alive</span></li>
      </ul>`
  };

  const work = document.getElementById('work');
  function setView(name) {
    document.querySelectorAll('.nav-item').forEach(n =>
      n.classList.toggle('sel', n.dataset.view === name));
    work.innerHTML = VIEWS[name]();
  }
  work.innerHTML = VIEWS.hardening();
  document.querySelectorAll('.nav-item').forEach(n =>
    n.addEventListener('click', () => setView(n.dataset.view)));
</script>

</body>
</html>
