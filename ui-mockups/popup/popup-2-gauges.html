<!DOCTYPE html>
<html lang="en" data-theme="cockpit">
<head>
  <meta charset="utf-8">
  <title>Tray popup · gauges variant</title>
  <link rel="stylesheet" href="../_elements/tokens.css">
  <link rel="stylesheet" href="../_elements/themes.css">
  <link rel="stylesheet" href="../_elements/base.css">
  <link rel="stylesheet" href="../_elements/elements-display.css">
  <link rel="stylesheet" href="../_elements/elements-lists.css">
  <link rel="stylesheet" href="../_elements/elements-containers.css">
  <link rel="stylesheet" href="../_elements/elements-size.css">
</head>
<body class="el-reset">
<div class="el-tray-frame" style="padding:var(--el-space-4)">

  <h1 style="font:700 var(--el-fs-md)/1 var(--el-font-display);margin:0;color:var(--el-accent);letter-spacing:0.04em">System gauges <small style="font:var(--el-fs-sm) var(--el-font-mono);color:var(--el-ink-soft);margin-left:var(--el-space-2)">cockpit HMI · monitor</small></h1>

  <div class="el-cluster" style="margin:var(--el-space-3) 0;justify-content:space-between">
    <div class="el-gauge"><div class="name">CPU</div><div class="val">42</div></div>
    <div class="el-gauge warn"><div class="name">MEM</div><div class="val">88</div></div>
    <div class="el-gauge ok"><div class="name">DSK</div><div class="val">12</div></div>
    <div class="el-gauge"><div class="name">NET</div><div class="val">66</div></div>
    <div class="el-gauge fail"><div class="name">ERR</div><div class="val">!</div></div>
    <div class="el-gauge ok"><div class="name">OK</div><div class="val">✓</div></div>
    <div class="el-gauge"><div class="name">TMP</div><div class="val">55</div></div>
    <div class="el-gauge"><div class="name">I/O</div><div class="val">21</div></div>
  </div>

  <h2 style="font:700 var(--el-fs-xs) var(--el-font-mono);color:var(--el-accent);letter-spacing:0.14em;text-transform:uppercase;margin:var(--el-space-3) 0 var(--el-space-1)">Live feed · 5s</h2>
  <div class="el-barograph" style="height:48px">
    <span class="bar" style="height:30%"></span><span class="bar" style="height:50%"></span>
    <span class="bar" style="height:40%"></span><span class="bar warn" style="height:80%"></span>
    <span class="bar" style="height:60%"></span><span class="bar" style="height:30%"></span>
    <span class="bar warn" style="height:70%"></span><span class="bar" style="height:45%"></span>
    <span class="bar fail" style="height:90%"></span><span class="bar" style="height:55%"></span>
    <span class="bar" style="height:42%"></span><span class="bar" style="height:68%"></span>
    <span class="bar warn" style="height:75%"></span><span class="bar" style="height:50%"></span>
    <span class="bar" style="height:35%"></span><span class="bar ok" style="height:20%"></span>
    <span class="bar" style="height:48%"></span><span class="bar" style="height:62%"></span>
  </div>

  <h2 style="font:700 var(--el-fs-xs) var(--el-font-mono);color:var(--el-accent);letter-spacing:0.14em;text-transform:uppercase;margin:var(--el-space-3) 0 var(--el-space-1)">Quick state</h2>
  <div class="el-cluster">
    <span class="el-pill ok"><span class="el-dot ok"></span>healthy</span>
    <span class="el-pill warn"><span class="el-dot warn"></span>degraded</span>
    <span class="el-pill fail"><span class="el-dot fail"></span>critical</span>
    <span class="el-pill live"><span class="el-dot live"></span>live</span>
  </div>

  <div style="font:var(--el-fs-xs) var(--el-font-mono);color:var(--el-ink-soft);margin-top:var(--el-space-3);text-align:center;letter-spacing:0.08em">cockpit · aviation HMI · data-theme="cockpit"</div>
</div>
</body>
</html>
