<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortexAgent — UI 7: Tree Outline + Detail</title>
<style>
  :root { --bg:#0a0e1a; --panel:#131826; --panel-2:#1a2032; --text:#e6e9f0;
          --unknown:#94a3b8; --accent:#38bdf8; --accent-dim:#1f3a4d;
          --ok:#4ade80; --warn:#fbbf24; --fail:#f87171; --border:#2a3142; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
         font-size:14px; min-height:100vh; }
  .tabs { display:flex; gap:4px; padding:12px 20px;
          border-bottom:1px solid var(--border); overflow-x:auto; }
  .tabs a { color:var(--unknown); text-decoration:none; padding:6px 10px;
            font-size:11px; border-radius:6px; border:1px solid transparent;
            white-space:nowrap; }
  .tabs a:hover { color:var(--text); border-color:var(--border); }
  .tabs a.active { color:var(--accent); border-color:var(--accent-dim);
                    background:rgba(56,189,248,0.06); }
  .tabs a.home { color:var(--warn); }

  .app { display:grid; grid-template-columns:300px 1fr;
         min-height:calc(100vh - 50px); }
  @media (max-width:900px) { .app { grid-template-columns:1fr; } }

  /* Tree pane */
  .tree { background:var(--panel); border-right:1px solid var(--border);
          padding:16px 8px; overflow-y:auto; font-size:12px; }
  .tree h3 { color:var(--accent); font-size:10px; letter-spacing:0.16em;
             text-transform:uppercase; margin:0 12px 10px; }

  /* Node */
  .n { display:flex; align-items:center; gap:6px; padding:5px 8px 5px 4px;
       border-radius:5px; cursor:pointer; color:var(--unknown);
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .n:hover { background:rgba(56,189,248,0.06); color:var(--text); }
  .n.sel { background:rgba(56,189,248,0.12); color:var(--accent); border-left:2px solid var(--accent); padding-left:2px; }
  .n .caret { width:14px; text-align:center; color:var(--unknown);
              font-family:monospace; }
  .n.open > .caret { transform:rotate(90deg); display:inline-block; }
  .n.folder { font-weight:600; color:var(--text); }
  .n .badge { background:var(--bg); color:var(--unknown); font-size:10px;
              padding:1px 5px; border-radius:4px; margin-left:auto;
              border:1px solid var(--border); }
  .n.sel .badge { color:var(--accent); border-color:var(--accent-dim); }
  .children { padding-left:18px; }
  .children.collapsed { display:none; }
  .ic { color:var(--unknown); margin-right:2px; }
  .ic.ok { color:var(--ok); } .ic.warn { color:var(--warn); } .ic.fail { color:var(--fail); }
  .ic.dot { font-size:8px; }

  /* Detail pane */
  .detail { padding:48px 56px; max-width:1000px; }
  .crumb { color:var(--unknown); font-size:11px; margin-bottom:4px; }
  .crumb .sep { color:var(--border); margin:0 6px; }
  .crumb strong { color:var(--accent); font-weight:500; }
  .dlabel { color:var(--accent); font-size:11px; letter-spacing:0.16em;
            text-transform:uppercase; margin-bottom:4px; }
  .dtitle { font-size:34px; color:var(--text); margin:6px 0 8px 0;
            font-weight:600; }
  .dsub { color:var(--unknown); font-size:13px; margin-bottom:32px;
          max-width:680px; }
  .dgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
           margin-bottom:28px; }
  .dcell { background:var(--panel); border:1px solid var(--border);
           border-radius:10px; padding:14px 16px; }
  .dcell .ttl { color:var(--unknown); font-size:10px;
                letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px; }
  .dcell .v { font-size:24px; color:var(--text); font-weight:600; }
  .dcell .meta { color:var(--unknown); font-size:11px; margin-top:2px; }

  .pill { padding:2px 8px; border-radius:12px; font-size:10px;
          font-weight:600; color:#000; }
  .pill.ok { background:var(--ok); } .pill.warn { background:var(--warn); }
  .pill.fail { background:var(--fail); } .pill.medium { background:#fb923c; }
  .pill.low { background:var(--ok); } .pill.high { background:var(--warn); }
  .pill.critical { background:var(--fail); }

  /* List rows */
  ul.rows { list-style:none; padding:0; margin:0; }
  ul.rows li { padding:10px 0; border-bottom:1px solid var(--border);
               display:flex; justify-content:space-between; font-size:13px; }
  ul.rows li:last-child { border-bottom:none; }
  ul.rows li .nm { color:var(--text); }
  ul.rows li .note { color:var(--unknown); font-size:11px; }
  ul.rows li .stamp { color:var(--unknown); font-size:11px; }
</style>
</head>
<body>

<nav class="tabs">
  <a href="../ui-mockup.html" class="home">v0.1 grid</a>
  <a href="ui-1.html">1 · command</a>
  <a href="ui-2.html">2 · orbit</a>
  <a href="ui-3.html">3 · timeline</a>
  <a href="ui-4.html">4 · cards</a>
  <a href="ui-5.html">5 · sidebar</a>
  <a href="ui-6.html">6 · bento</a>
  <a href="ui-7.html" class="active">7 · tree</a>
  <a href="ui-8.html">8 · hud</a>
</nav>

<div class="app">
  <nav class="tree" id="tree">
    <h3>ROOT</h3>
    <!-- tree built by JS -->
  </nav>

  <main class="detail" id="detail"></main>
</div>

<script>
  // Hierarchical tree data
  const TREE = {
    name:'/cortexagent', kind:'folder', open:true, children:[
      { name:'hardening', kind:'folder', badge:'7', open:true, children:[
        {name:'auditd',        kind:'leaf', icon:'ic warn', badge:'W'},
        {name:'capabilities',  kind:'leaf', icon:'ic ok',   badge:'O'},
        {name:'dns_blocklist', kind:'leaf', icon:'ic ok',   badge:'O'},
        {name:'dnsmasq',       kind:'leaf', icon:'ic ok',   badge:'O'},
        {name:'lsms',          kind:'leaf', icon:'ic ok',   badge:'O'},
        {name:'nftables',      kind:'leaf', icon:'ic fail', badge:'F'},
        {name:'apparmor',      kind:'leaf', icon:'ic ok',   badge:'O'},
      ]},
      { name:'siem', kind:'folder', badge:'12', open:false, children:[
        {name:'scan · 10',       kind:'leaf'},
        {name:'firewall · 2',    kind:'leaf'},
        {name:'critical · 1',    kind:'leaf', icon:'ic fail'},
        {name:'high · 11',       kind:'leaf', icon:'ic warn'},
        {name:'finding #22',     kind:'leaf', icon:'ic critical'},
        {name:'finding #12',     kind:'leaf', icon:'ic warn'},
        {name:'finding #32',     kind:'leaf', icon:'ic warn'},
        {name:'finding #91',     kind:'leaf', icon:'ic warn'},
        {name:'finding #3',      kind:'leaf', icon:'ic warn'},
      ]},
      { name:'cve', kind:'folder', badge:'3', open:false, children:[
        {name:'CVE-2026-1234 medium',  kind:'leaf', icon:'ic warn'},
        {name:'CVE-2026-1192 low',     kind:'leaf', icon:'ic ok'},
        {name:'CVE-2026-1144 low',     kind:'leaf', icon:'ic ok'},
      ]},
      { name:'soar', kind:'folder', badge:'2', open:false, children:[
        {name:'pb.fw.port-scan.isolate · 02:11', kind:'leaf'},
        {name:'pb.cve.triage · 01:47',           kind:'leaf'},
      ]},
      { name:'pipeline', kind:'folder', badge:'10', open:false, children:[
        {name:'1 COLLECT',       kind:'leaf'},
        {name:'2 COMPOSE',       kind:'leaf'},
        {name:'3 FRAME_OF_REF',  kind:'leaf'},
        {name:'4 MEMORY_CHECK',  kind:'leaf'},
        {name:'5 SLIMTOKEN',     kind:'leaf'},
        {name:'6 TOOL_ROUTING',  kind:'leaf'},
        {name:'7 FINALIZE',      kind:'leaf'},
        {name:'8 PREFILL',       kind:'leaf'},
        {name:'9 DECODE',        kind:'leaf'},
        {name:'10 DELIVER',      kind:'leaf'},
      ]},
      { name:'services', kind:'folder', badge:'5', open:false, children:[
        {name:'cortexagent.service · 12h 14m',  kind:'leaf', icon:'ic ok'},
        {name:'cortexagent-overseer.service',   kind:'leaf', icon:'ic ok'},
        {name:'siem-console.service · :9998',   kind:'leaf', icon:'ic ok'},
        {name:'cortexagent-tray.service',       kind:'leaf', icon:'ic ok'},
        {name:'canary-server.service · :8092',  kind:'leaf', icon:'ic ok'},
      ]},
    ]
  };

  // Build DOM
  const tree = document.getElementById('tree');
  function build(node) {
    const wrap = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'n' + (node.kind === 'folder' ? ' folder' : '');
    if (node.open) row.classList.add('open');
    const caret = node.kind === 'folder'
      ? `<span class="caret">▸</span>` : `<span class="caret"></span>`;
    const ic = node.icon ? `<span class="${node.icon} ic dot">●</span>` : '';
    row.innerHTML = `${caret}${ic}<span>${node.name}</span>${
      node.badge ? `<span class="badge">${node.badge}</span>` : ''}`;
    wrap.appendChild(row);
    if (node.children) {
      const kids = document.createElement('div');
      kids.className = 'children' + (node.open ? '' : ' collapsed');
      node.children.forEach(c => kids.appendChild(build(c)));
      wrap.appendChild(kids);
      row.addEventListener('click', e => {
        e.stopPropagation();
        const wasOpen = row.classList.contains('open');
        row.classList.toggle('open');
        kids.classList.toggle('collapsed');
        // Update node.open for view logic
        node.open = !wasOpen;
      });
    } else {
      row.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelectorAll('.n').forEach(n => n.classList.remove('sel'));
        row.classList.add('sel');
        showDetail(node);
      });
    }
    return wrap;
  }
  tree.appendChild(build(TREE));

  // Detail renderer: derive from path
  function findPath(target, path=[]) {
    for (const child of (target.children || [])) {
      const next = [...path, target];
      if (child === TARGET) return [...next, child];
      const found = findPath(child, next);
      if (found) return found;
    }
    return null;
  }
  let TARGET = null;

  function showDetail(node) {
    TARGET = node;
    const d = document.getElementById('detail');
    if (node.name === 'auditd') {
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> hardening <span class="sep">/</span> <strong>auditd</strong></div>
        <div class="dlabel">subsystem</div>
        <h1 class="dtitle">auditd</h1>
        <p class="dsub">Linux audit daemon. Live-probed at
          <code>:8093/api/hardening/auditd</code>.</p>
        <div class="dgrid">
          <div class="dcell"><div class="ttl">posture</div><div class="v" style="color:var(--warn)">WARN</div><div class="meta">2 rules failed</div></div>
          <div class="dcell"><div class="ttl">rules</div><div class="v">62</div><div class="meta">2 failed to load</div></div>
          <div class="dcell"><div class="ttl">probe ms</div><div class="v">14</div><div class="meta">last 5m avg</div></div>
        </div>
        <ul class="rows">
          <li><span class="nm">action</span><span class="pill warn">re-run rules</span></li>
          <li><span class="nm">log file</span><span class="note">/var/log/audit/audit.log</span></li>
        </ul>`;
    } else if (node.name === 'nftables') {
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> hardening <span class="sep">/</span> <strong>nftables</strong></div>
        <div class="dlabel">subsystem</div>
        <h1 class="dtitle">nftables</h1>
        <p class="dsub">Linux nftables firewall. Currently FAIL because the probe can't enumerate root-owned tables without privilege.</p>
        <div class="dgrid">
          <div class="dcell"><div class="ttl">posture</div><div class="v" style="color:var(--fail)">FAIL</div></div>
          <div class="dcell"><div class="ttl">status</div><div class="v">unknown</div><div class="meta">needs root</div></div>
          <div class="dcell"><div class="ttl">rules</div><div class="v">?</div><div class="meta">n/a without sudo</div></div>
        </div>
        <ul class="rows">
          <li><span class="nm">action</span><span class="pill fail">manually re-run as root</span></li>
        </ul>`;
    } else if (node.name && node.name.startsWith('finding #')) {
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> siem <span class="sep">/</span> <strong>${node.name}</strong></div>
        <div class="dlabel">finding</div>
        <h1 class="dtitle">${node.name}</h1>
        <p class="dsub">Click any finding to inspect. Real-time detail panel from siem.db.</p>
        <div class="dgrid">
          <div class="dcell"><div class="ttl">severity</div><div class="v">HIGH</div></div>
          <div class="dcell"><div class="ttl">source</div><div class="v">scan</div></div>
          <div class="dcell"><div class="ttl">ts</div><div class="v" style="font-size:14px;">2026-08-18 23:04</div></div>
        </div>
        <ul class="rows">
          <li><span class="nm">actions</span><span class="note">acknowledge · tag · escalate</span></li>
        </ul>`;
    } else if (node.name && node.name.startsWith('CVE-')) {
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> cve <span class="sep">/</span> <strong>${node.name.split(' ')[0]}</strong></div>
        <div class="dlabel">cve</div>
        <h1 class="dtitle">${node.name.split(' ').slice(1).join(' ')}</h1>
        <p class="dsub">Recent CVE; full feed at <code>:8093/api/cve/recent</code>.</p>
        <div class="dgrid">
          <div class="dcell"><div class="ttl">sev</div><div class="v">MED</div></div>
          <div class="dcell"><div class="ttl">cvss</div><div class="v">5.4</div></div>
          <div class="dcell"><div class="ttl">kev</div><div class="v" style="color:var(--ok)">no</div></div>
        </div>`;
    } else if (node.name && node.name.startsWith('pb.')) {
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> soar <span class="sep">/</span> <strong>${node.name.split(' · ')[0]}</strong></div>
        <div class="dlabel">soar run</div>
        <h1 class="dtitle">${node.name.split(' · ')[0]}</h1>
        <p class="dsub">Recorded playbook execution.</p>
        <div class="dgrid">
          <div class="dcell"><div class="ttl">result</div><div class="v" style="color:var(--ok)">OK</div></div>
          <div class="dcell"><div class="ttl">ts</div><div class="v" style="font-size:14px;">${node.name.split(' · ')[1] || '—'}</div></div>
          <div class="dcell"><div class="ttl">duration</div><div class="v">0.4s</div></div>
        </div>`;
    } else if (node.name && /^\d+\s/.test(node.name)) {
      const [num, stage] = node.name.split(' ', 2);
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> pipeline <span class="sep">/</span> <strong>${stage}</strong></div>
        <div class="dlabel">pipeline stage</div>
        <h1 class="dtitle">${stage}</h1>
        <p class="dsub">Pipeline stage ${num} of 10. Full 3D at <code>:8090/pipeline</code>.</p>
        <div class="dgrid">
          <div class="dcell"><div class="ttl">position</div><div class="v">${num}/10</div></div>
          <div class="dcell"><div class="ttl">avg hold</div><div class="v">5.0s</div></div>
          <div class="dcell"><div class="ttl">role</div><div class="v" style="font-size:14px;">token transformation</div></div>
        </div>`;
    } else if (node.name && node.name.includes('.service')) {
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> services <span class="sep">/</span> <strong>${node.name.split(' · ')[0]}</strong></div>
        <div class="dlabel">service</div>
        <h1 class="dtitle">${node.name.split(' · ')[0]}</h1>
        <p class="dsub">systemd user unit. <code>systemctl --user status <name></code> to inspect.</p>
        <div class="dgrid">
          <div class="dcell"><div class="ttl">state</div><div class="v" style="color:var(--ok)">active</div></div>
          <div class="dcell"><div class="ttl">uptime</div><div class="v">12h 14m</div></div>
          <div class="dcell"><div class="ttl">pid</div><div class="v" style="font-size:18px;">728</div></div>
        </div>
        <ul class="rows">
          <li><span class="nm">action</span><span class="note">stop · restart · logs</span></li>
        </ul>`;
    } else {
      d.innerHTML = `
        <div class="crumb">/cortexagent <span class="sep">/</span> <strong>${node.name}</strong></div>
        <div class="dlabel">node</div>
        <h1 class="dtitle">${node.name}</h1>
        <p class="dsub">Browse the tree on the left to drill into a specific item.</p>`;
    }
  }

  // Initial: select auditd
  setTimeout(() => {
    const first = document.querySelector('.children .n:not(.folder)');
    if (first) first.click();
  }, 100);

</script>

</body>
</html>
