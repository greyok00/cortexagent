<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Console Log + Tree — Security dashboard theme">
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#06080b"/>
    </linearGradient>
  </defs>

  <!-- terminal black -->
  <rect width="256" height="256" fill="url(#term-bg)"/>

  <!-- 3-column header chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing="0.12em">
    <rect x="8" y="8" width="78" height="10" fill="none" stroke="#2a3142"/>
    <text x="12" y="15" fill="#94a3b8">SUBSYSTEMS</text>

    <rect x="92" y="8" width="78" height="10" fill="none" stroke="#2a3142"/>
    <text x="96" y="15" fill="#94a3b8">EVENTS · LIVE</text>

    <rect x="176" y="8" width="72" height="10" fill="none" stroke="#ffb000"/>
    <text x="180" y="15" fill="#ffb000">KEV · CVE</text>
  </g>

  <!-- LEFT — subsystem tree -->
  <g font-family="'JetBrains Mono', monospace" font-size="8">
    <text x="12" y="36" fill="#94a3b8">▸ network</text>
    <text x="20" y="48" fill="#94a3b8">  ├ nft</text>
    <text x="28" y="60" fill="#ff5a52">  │ └ ✗ drop</text>
    <text x="20" y="72" fill="#94a3b8">  └ dnsmasq</text>
    <text x="12" y="88" fill="#94a3b8">▸ kernel</text>
    <text x="20" y="100" fill="#94a3b8">  ├ sysctl</text>
    <text x="28" y="112" fill="#ff5a52">  │ └ ✗ 5 diff</text>
    <text x="20" y="124" fill="#94a3b8">  └ lsms</text>
    <text x="12" y="140" fill="#94a3b8">▸ identity</text>
    <text x="20" y="152" fill="#94a3b8">  └ sshd</text>
    <text x="28" y="164" fill="#ff5a52">    └ ✗ 10 dev</text>
    <text x="12" y="180" fill="#94a3b8">▸ audit</text>
    <text x="20" y="192" fill="#5fe09a">  └ ✓ ok</text>
    <text x="12" y="208" fill="#94a3b8">▸ caps</text>
    <text x="20" y="220" fill="#5fe09a">  └ ✓ ok</text>
  </g>

  <!-- CENTER — log stream -->
  <g font-family="'JetBrains Mono', monospace" font-size="8">
    <rect x="92" y="26" width="78" height="220" fill="#11151b" stroke="#2a3142"/>
    <text x="96" y="38" fill="#94a3b8">11:13:18</text>
    <text x="96" y="50" fill="#ffb000">HIGH</text>
    <text x="96" y="62" fill="#e6e9f0">block-src</text>
    <text x="96" y="80" fill="#94a3b8">10:47:02</text>
    <text x="96" y="92" fill="#5fe09a">OK</text>
    <text x="96" y="104" fill="#e6e9f0">isolate</text>
    <text x="96" y="122" fill="#94a3b8">09:22:54</text>
    <text x="96" y="134" fill="#ffb000">HIGH</text>
    <text x="96" y="146" fill="#e6e9f0">enrich</text>
    <text x="96" y="164" fill="#94a3b8">08:00:00</text>
    <text x="96" y="176" fill="#5fe09a">OK</text>
    <text x="96" y="188" fill="#e6e9f0">scan</text>
    <!-- blinking caret -->
    <rect x="96" y="202" width="6" height="10" fill="#ffb000"/>
  </g>

  <!-- RIGHT — KEV feed -->
  <g font-family="'JetBrains Mono', monospace" font-size="8">
    <rect x="176" y="26" width="72" height="220" fill="#11151b" stroke="#2a3142"/>
    <text x="180" y="42" fill="#ff5a52" font-weight="700">CVE-2025</text>
    <text x="180" y="54" fill="#94a3b8">-30872</text>
    <text x="180" y="68" fill="#e6e9f0">CVSS 9.8</text>
    <text x="180" y="80" fill="#ffb000">KEV listed</text>

    <line x1="180" y1="92" x2="244" y2="92" stroke="#2a3142"/>
    <text x="180" y="108" fill="#ff5a52" font-weight="700">CVE-2025</text>
    <text x="180" y="120" fill="#94a3b8">-30118</text>
    <text x="180" y="134" fill="#e6e9f0">CVSS 9.4</text>

    <line x1="180" y1="146" x2="244" y2="146" stroke="#2a3142"/>
    <text x="180" y="162" fill="#ffd166" font-weight="700">CVE-2025</text>
    <text x="180" y="174" fill="#94a3b8">-29407</text>
    <text x="180" y="188" fill="#e6e9f0">CVSS 8.1</text>
    <text x="180" y="200" fill="#94a3b8">EPS 0.42</text>

    <line x1="180" y1="212" x2="244" y2="212" stroke="#2a3142"/>
    <text x="180" y="228" fill="#94a3b8">+ 9 more</text>
  </g>
</svg>