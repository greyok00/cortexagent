<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Paper Schematic — CortexAgent pipeline theme">
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e8eef2" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="256" height="256" fill="#ffffff"/>
  <rect width="256" height="256" fill="url(#paper-grid)"/>

  <!-- figure caption strip -->
  <text x="16" y="22" font-family="'JetBrains Mono', monospace"
        font-size="9" fill="#0e7c86" letter-spacing="0.16em" font-weight="700">
    FIG. 1 — PIPELINE
  </text>
  <line x1="16" y1="28" x2="240" y2="28" stroke="#0a1929" stroke-width="0.8"/>

  <!-- the 5 stages — boxes with teal-ink numbers, connected by hand-drawn arrows -->
  <g font-family="Fraunces, 'Times New Roman', serif" fill="#0a1929">
    <!-- stage 1 -->
    <rect x="16" y="60" width="36" height="36" fill="none" stroke="#0a1929" stroke-width="1.4"/>
    <rect x="16" y="60" width="14" height="14" fill="#0a1929"/>
    <text x="20" y="71" font-size="10" fill="#ffffff" font-weight="700">1</text>
    <text x="20" y="111" font-size="8" fill="#0a1929">IN</text>

    <!-- stage 2 -->
    <rect x="68" y="60" width="36" height="36" fill="none" stroke="#0a1929" stroke-width="1.4"/>
    <rect x="68" y="60" width="14" height="14" fill="#0a1929"/>
    <text x="72" y="71" font-size="10" fill="#ffffff" font-weight="700">2</text>
    <text x="70" y="111" font-size="8" fill="#0a1929">TOK</text>

    <!-- stage 3 -->
    <rect x="120" y="60" width="36" height="36" fill="none" stroke="#0a1929" stroke-width="1.4"/>
    <rect x="120" y="60" width="14" height="14" fill="#0a1929"/>
    <text x="124" y="71" font-size="10" fill="#ffffff" font-weight="700">3</text>
    <text x="118" y="111" font-size="8" fill="#0a1929">SLIM</text>

    <!-- stage 4 -->
    <rect x="172" y="60" width="36" height="36" fill="none" stroke="#0a1929" stroke-width="1.4"/>
    <rect x="172" y="60" width="14" height="14" fill="#0a1929"/>
    <text x="176" y="71" font-size="10" fill="#ffffff" font-weight="700">4</text>
    <text x="170" y="111" font-size="8" fill="#0a1929">RTRV</text>

    <!-- stage 5 -->
    <rect x="224" y="60" width="20" height="36" fill="none" stroke="#b85a2c" stroke-width="1.4"/>
    <text x="218" y="111" font-size="8" fill="#b85a2c">GEN</text>

    <!-- arrows between stages — slightly hand-drawn curves -->
    <g stroke="#0a1929" stroke-width="1.2" fill="#0a1929">
      <path d="M 52 78 Q 60 74, 68 78" fill="none"/>
      <polygon points="68,78 64,76 64,80"/>
      <path d="M 104 78 Q 112 74, 120 78" fill="none"/>
      <polygon points="120,78 116,76 116,80"/>
      <path d="M 156 78 Q 164 74, 172 78" fill="none"/>
      <polygon points="172,78 168,76 168,80"/>
    </g>
    <!-- last arrow in warm ink -->
    <g stroke="#b85a2c" stroke-width="1.2" fill="#b85a2c">
      <path d="M 208 78 Q 216 82, 224 78" fill="none" stroke-dasharray="2,2"/>
      <polygon points="224,78 220,76 220,80"/>
    </g>
  </g>

  <!-- math notation strip -->
  <g font-family="Fraunces, serif" font-style="italic" fill="#085459">
    <text x="16" y="148" font-size="11">17 → 9 tokens</text>
    <text x="16" y="166" font-size="11">3 memory hits</text>
    <text x="16" y="184" font-size="11">~ 1.85 s</text>
  </g>

  <!-- footer with output indicator -->
  <line x1="16" y1="208" x2="240" y2="208" stroke="#cdd8e0" stroke-width="0.6"/>
  <text x="16" y="226" font-family="Fraunces, serif" font-size="10" fill="#0a1929" font-style="italic">
    "Rule 401 vs 402…"
  </text>
  <text x="220" y="226" font-family="'JetBrains Mono', monospace"
        font-size="9" fill="#b85a2c" text-anchor="end" letter-spacing="0.06em">▸ OUTPUT</text>
</svg>
