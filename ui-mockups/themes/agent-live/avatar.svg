<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Live Pulse — CortexAgent pipeline theme">
  <defs>
    <linearGradient id="live-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1419"/>
      <stop offset="1" stop-color="#060a0d"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ffb000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark canvas -->
  <rect width="256" height="256" fill="url(#live-bg)"/>

  <!-- subtle grid -->
  <g stroke="#1a2329" stroke-width="0.5">
    <line x1="0" y1="40" x2="256" y2="40"/>
    <line x1="0" y1="80" x2="256" y2="80"/>
    <line x1="0" y1="120" x2="256" y2="120"/>
    <line x1="0" y1="160" x2="256" y2="160"/>
    <line x1="0" y1="200" x2="256" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="256"/>
    <line x1="80" y1="0" x2="80" y2="256"/>
    <line x1="120" y1="0" x2="120" y2="256"/>
    <line x1="160" y1="0" x2="160" y2="256"/>
    <line x1="200" y1="0" x2="200" y2="256"/>
  </g>

  <!-- header -->
  <text x="16" y="22" font-family="'JetBrains Mono', monospace"
        font-size="9" fill="#ffb000" letter-spacing="0.16em" font-weight="700">
    PIPELINE · LIVE
  </text>
  <text x="240" y="22" font-family="'JetBrains Mono', monospace"
        font-size="9" fill="#94a3b8" text-anchor="end">t = 1.85s</text>

  <!-- 5 stages on a horizontal track -->
  <g font-family="Fraunces, serif" fill="#e6e9f0">
    <!-- stage dots -->
    <g>
      <circle cx="40"  cy="100" r="8" fill="#0e7c86"/>
      <text x="40"  y="103" font-size="8" text-anchor="middle" fill="#060a0d" font-weight="700">1</text>
      <text x="40"  y="124" font-size="8" text-anchor="middle" fill="#94a3b8">IN</text>

      <circle cx="80"  cy="100" r="8" fill="#0e7c86"/>
      <text x="80"  y="103" font-size="8" text-anchor="middle" fill="#060a0d" font-weight="700">2</text>
      <text x="80"  y="124" font-size="8" text-anchor="middle" fill="#94a3b8">TOK</text>

      <!-- ACTIVE stage with breathing pulse -->
      <circle cx="130" cy="100" r="20" fill="url(#pulse)">
        <animate attributeName="r" values="14;22;14" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="100" r="10" fill="#ffb000"/>
      <text x="130" y="103" font-size="9" text-anchor="middle" fill="#060a0d" font-weight="700">3</text>
      <text x="130" y="124" font-size="8" text-anchor="middle" fill="#ffb000">SLIM</text>

      <circle cx="180" cy="100" r="8" fill="#1f2a31" stroke="#3a4651"/>
      <text x="180" y="103" font-size="8" text-anchor="middle" fill="#94a3b8">4</text>
      <text x="180" y="124" font-size="8" text-anchor="middle" fill="#94a3b8">RTRV</text>

      <circle cx="220" cy="100" r="8" fill="#1f2a31" stroke="#3a4651"/>
      <text x="220" y="103" font-size="8" text-anchor="middle" fill="#94a3b8">5</text>
      <text x="220" y="124" font-size="8" text-anchor="middle" fill="#94a3b8">GEN</text>
    </g>

    <!-- connecting bar with progress fill -->
    <line x1="48" y1="100" x2="212" y2="100" stroke="#1f2a31" stroke-width="2"/>
    <line x1="48" y1="100" x2="135" y2="100" stroke="#ffb000" stroke-width="2"/>
  </g>

  <!-- token strip at the bottom — live typing -->
  <g transform="translate(16,160)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace"
          font-size="8" fill="#94a3b8" letter-spacing="0.14em">▸ LIVE TOKENS</text>
    <rect x="0" y="8" width="224" height="56" fill="#11151b" stroke="#2a3142"/>
    <text x="6" y="22" font-family="Fraunces, serif" font-style="italic"
          font-size="11" fill="#e6e9f0">Rule 401 vs 402 — admissibility</text>
    <text x="6" y="36" font-family="Fraunces, serif" font-style="italic"
          font-size="11" fill="#e6e9f0">turns on whether the probative</text>
    <text x="6" y="50" font-family="Fraunces, serif" font-style="italic"
          font-size="11" fill="#ffb000">value is substantially outweigh<tspan>▎</tspan>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>