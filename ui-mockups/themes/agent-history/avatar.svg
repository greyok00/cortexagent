<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="History Diff — CortexAgent pipeline theme">
  <defs>
    <linearGradient id="hist-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe3"/>
      <stop offset="1" stop-color="#ebe3d1"/>
    </linearGradient>
  </defs>

  <!-- warm white paper -->
  <rect width="256" height="256" fill="url(#hist-paper)"/>

  <!-- top bar with title and date -->
  <text x="16" y="20" font-family="'JetBrains Mono', monospace"
        font-size="9" fill="#0e7c86" letter-spacing="0.16em" font-weight="700">PIPELINE · HISTORY</text>
  <text x="240" y="20" font-family="'JetBrains Mono', monospace"
        font-size="8" fill="#085459" text-anchor="end">42 runs · 7 days</text>
  <line x1="16" y1="28" x2="240" y2="28" stroke="#0a1929" stroke-width="0.6"/>

  <!-- column headers -->
  <g font-family="'JetBrains Mono', monospace" font-size="7" fill="#085459" letter-spacing="0.12em">
    <text x="16"  y="42">HASH</text>
    <text x="76"  y="42">PROMPT</text>
    <text x="170" y="42" text-anchor="end">MS</text>
    <text x="200" y="42" text-anchor="end">STATUS</text>
    <text x="240" y="42" text-anchor="end">TOK</text>
  </g>
  <line x1="16" y1="46" x2="240" y2="46" stroke="#cdd8e0" stroke-width="0.6"/>

  <!-- 6 history rows -->
  <g font-family="Fraunces, serif" font-size="9" fill="#0a1929">
    <!-- row 1 -->
    <text x="16" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0e7c86">a1f9c2</text>
    <text x="76" y="60">Rule 401 vs 402 — admissibility…</text>
    <text x="170" y="60" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">1853</text>
    <text x="200" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5b8a51" text-anchor="end">✓ OK</text>
    <text x="240" y="60" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">9</text>

    <!-- row 2 -->
    <text x="16" y="78" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0e7c86">b4e7a0</text>
    <text x="76" y="78">Migrate docs/v2 → docs/v3 paths</text>
    <text x="170" y="78" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">2401</text>
    <text x="200" y="78" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5b8a51" text-anchor="end">✓ OK</text>
    <text x="240" y="78" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">12</text>

    <!-- row 3 -->
    <text x="16" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0e7c86">7d3c91</text>
    <text x="76" y="96">SIEM rule — block-source-ip baseline</text>
    <text x="170" y="96" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">942</text>
    <text x="200" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5b8a51" text-anchor="end">✓ OK</text>
    <text x="240" y="96" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">6</text>

    <!-- row 4 — expanded/selected -->
    <rect x="8" y="106" width="240" height="56" fill="#fff7e3" stroke="#b85a2c" stroke-width="0.8"/>
    <text x="16" y="120" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0e7c86" font-weight="700">e2b108</text>
    <text x="76" y="120">OSINT — reinhart / larkspur trace</text>
    <text x="170" y="120" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">3120</text>
    <text x="200" y="120" font-family="'JetBrains Mono', monospace" font-size="8" fill="#b85a2c" text-anchor="end">~ SLOW</text>
    <text x="240" y="120" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">14</text>
    <!-- expanded detail lines -->
    <text x="76" y="138" font-size="8" fill="#085459" font-style="italic">IN → TOK → SLIM(17→9) → RTRV(3) → GEN</text>
    <text x="76" y="152" font-size="8" fill="#085459" font-style="italic">bottleneck: retriever waited 1.6s</text>
    <text x="76" y="164" font-size="8" fill="#b85a2c" font-style="italic">+ see full reply ▾</text>

    <!-- row 5 -->
    <text x="16" y="184" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0e7c86">5c0a7e</text>
    <text x="76" y="184">Hardening — sshd baseline check</text>
    <text x="170" y="184" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">612</text>
    <text x="200" y="184" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5b8a51" text-anchor="end">✓ OK</text>
    <text x="240" y="184" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">4</text>

    <!-- row 6 -->
    <text x="16" y="202" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0e7c86">f93d12</text>
    <text x="76" y="202">NVD — annotate 12 CVEs from KEV</text>
    <text x="170" y="202" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">3398</text>
    <text x="200" y="202" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5b8a51" text-anchor="end">✓ OK</text>
    <text x="240" y="202" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">11</text>
  </g>

  <!-- footer -->
  <line x1="16" y1="220" x2="240" y2="220" stroke="#cdd8e0" stroke-width="0.6"/>
  <text x="16"  y="238" font-family="Fraunces, serif" font-style="italic" font-size="9" fill="#0a1929">▸ older runs</text>
  <text x="240" y="238" font-family="Fraunces, serif" font-style="italic" font-size="9" fill="#085459" text-anchor="end">click row to expand</text>
</svg>