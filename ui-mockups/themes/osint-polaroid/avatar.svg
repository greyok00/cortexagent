<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Polaroid Wall — OSINT overview theme">
  <defs>
    <linearGradient id="wall-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1a17"/>
      <stop offset="1" stop-color="#0e0b09"/>
    </linearGradient>
    <radialGradient id="pin-rust" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff7c5a"/>
      <stop offset="0.7" stop-color="#b04a2a"/>
      <stop offset="1" stop-color="#6a2a18"/>
    </radialGradient>
    <radialGradient id="pin-teal" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#7ab4d6"/>
      <stop offset="0.7" stop-color="#2c6e6f"/>
      <stop offset="1" stop-color="#15484a"/>
    </radialGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- wall -->
  <rect width="256" height="256" fill="url(#wall-bg)"/>
  <rect width="256" height="256" fill="#0e0b09" opacity="0.5"/>

  <!-- thread lines connecting cards -->
  <g stroke="#d6c89e" stroke-width="1.2" fill="none" stroke-dasharray="3,4" opacity="0.45">
    <path d="M 70,80 Q 130,140 90,180"/>
    <path d="M 130,70 Q 180,140 200,200"/>
  </g>

  <!-- three polaroid cards, slightly rotated -->
  <g filter="url(#card-shadow)">
    <!-- card 1 — back-left, rotated counter-clockwise -->
    <g transform="rotate(-7 70 110) translate(20,40)">
      <rect width="100" height="120" fill="#efe5cf" stroke="#d6c89e"/>
      <rect x="8" y="8" width="84" height="80" fill="#cdb89a"/>
      <line x1="8" y1="100" x2="60" y2="100" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="8" y1="108" x2="48" y2="108" stroke="#1d1d1d" stroke-width="1"/>
      <circle cx="50" cy="0" r="5" fill="url(#pin-rust)"/>
    </g>

    <!-- card 2 — center-front, vertical -->
    <g transform="rotate(2 130 130) translate(78,52)">
      <rect width="100" height="120" fill="#f3e9d3" stroke="#d6c89e"/>
      <rect x="8" y="8" width="84" height="80" fill="#b6a78a"/>
      <line x1="8" y1="100" x2="68" y2="100" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="8" y1="108" x2="40" y2="108" stroke="#1d1d1d" stroke-width="1"/>
      <circle cx="50" cy="0" r="5" fill="url(#pin-teal)"/>
    </g>

    <!-- card 3 — right-back, rotated clockwise -->
    <g transform="rotate(8 200 130) translate(148,55)">
      <rect width="100" height="120" fill="#efe5cf" stroke="#d6c89e"/>
      <rect x="8" y="8" width="84" height="80" fill="#cdb89a"/>
      <line x1="8" y1="100" x2="56" y2="100" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="8" y1="108" x2="36" y2="108" stroke="#1d1d1d" stroke-width="1"/>
      <circle cx="50" cy="0" r="5" fill="url(#pin-rust)"/>
    </g>
  </g>
</svg>
