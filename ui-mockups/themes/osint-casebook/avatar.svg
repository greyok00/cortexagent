<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Casebook Notebook — OSINT search results theme">
  <defs>
    <linearGradient id="cb-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ede1"/>
      <stop offset="1" stop-color="#e8e0cf"/>
    </linearGradient>
  </defs>

  <!-- notebook paper -->
  <rect width="256" height="256" fill="url(#cb-paper)"/>

  <!-- red margin line (left margin) -->
  <line x1="56" y1="0" x2="56" y2="256" stroke="#c8743b" stroke-width="1" opacity="0.65"/>

  <!-- ruling lines -->
  <g stroke="#a89c80" stroke-width="0.4" opacity="0.55">
    <line x1="20" y1="36" x2="240" y2="36"/>
    <line x1="20" y1="60" x2="240" y2="60"/>
    <line x1="20" y1="84" x2="240" y2="84"/>
    <line x1="20" y1="108" x2="240" y2="108"/>
    <line x1="20" y1="132" x2="240" y2="132"/>
    <line x1="20" y1="156" x2="240" y2="156"/>
    <line x1="20" y1="180" x2="240" y2="180"/>
    <line x1="20" y1="204" x2="240" y2="204"/>
    <line x1="20" y1="228" x2="240" y2="228"/>
  </g>

  <!-- ink heading -->
  <text x="68" y="52" font-family="Garamond, 'EB Garamond', serif"
        font-size="22" font-style="italic" fill="#1a1a1a" font-weight="600">
    Findings
  </text>

  <!-- numbered entries (filings) -->
  <g font-family="Garamond, serif" fill="#1a1a1a">
    <!-- entry 01 -->
    <text x="68" y="80" font-size="14" font-style="italic" fill="#a64b2a">01.</text>
    <rect x="84" y="69" width="148" height="3" fill="#1a1a1a"/>
    <rect x="84" y="78" width="110" height="2" fill="#1a1a1a"/>

    <!-- entry 02 -->
    <text x="68" y="104" font-size="14" font-style="italic" fill="#a64b2a">02.</text>
    <rect x="84" y="93" width="140" height="3" fill="#1a1a1a"/>
    <rect x="84" y="102" width="124" height="2" fill="#1a1a1a"/>

    <!-- entry 03 -->
    <text x="68" y="128" font-size="14" font-style="italic" fill="#a64b2a">03.</text>
    <rect x="84" y="117" width="132" height="3" fill="#1a1a1a"/>
    <rect x="84" y="126" width="100" height="2" fill="#1a1a1a"/>
  </g>

  <!-- margin note (📌) -->
  <g font-family="Garamond, serif">
    <text x="20" y="170" font-size="11" fill="#c9a227" font-style="italic">📌</text>
    <text x="20" y="184" font-size="9" fill="#a64b2a">reinhart</text>
    <text x="20" y="196" font-size="9" fill="#a64b2a">/ larkspur</text>
  </g>

  <!-- bottom-right sage chip -->
  <rect x="184" y="218" width="48" height="20" fill="none" stroke="#6b8068" stroke-width="1"/>
  <text x="190" y="232" font-family="'JetBrains Mono', monospace"
        font-size="9" fill="#6b8068" letter-spacing="0.06em">CASE-01</text>
</svg>
