<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-label="greyok-ui-framework logo">
  <title>greyok-ui-framework</title>
  <defs>
    <linearGradient id="gw-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="gw-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2530"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <linearGradient id="gw-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Frame box: the framework container -->
  <rect x="8" y="14" width="120" height="92" rx="14" ry="14" fill="url(#gw-frame)"/>
  <rect x="8" y="14" width="120" height="92" rx="14" ry="14" fill="none" stroke="#ffb000" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Title bar dots (cosmetic chrome) -->
  <circle cx="20"  cy="28" r="2.4" fill="#ff5a52"/>
  <circle cx="29"  cy="28" r="2.4" fill="#ffd166"/>
  <circle cx="38"  cy="28" r="2.4" fill="#5fe09a"/>

  <!-- Bento tiles: 4 primitive elements inside the frame -->
  <!-- pill -->
  <rect x="22" y="46" width="40" height="12" rx="6" ry="6" fill="url(#gw-tile)"/>
  <!-- dot -->
  <circle cx="74" cy="52" r="6" fill="#5fe09a">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- mini-bar -->
  <rect x="86"  y="50" width="4" height="8"  rx="1" fill="#ffb000"/>
  <rect x="92"  y="46" width="4" height="12" rx="1" fill="#ffb000"/>
  <rect x="98"  y="42" width="4" height="16" rx="1" fill="#ffb000"/>
  <rect x="104" y="48" width="4" height="10" rx="1" fill="#ffb000"/>

  <!-- Progress row -->
  <rect x="22" y="74" width="92" height="6" rx="3" ry="3" fill="#1a1f2a"/>
  <rect x="22" y="74" width="62" height="6" rx="3" ry="3" fill="#5fe09a"/>

  <!-- Big-num / kbd hint -->
  <rect x="22" y="88" width="22" height="10" rx="3" ry="3" fill="#1a1f2a" stroke="#ffb000" stroke-opacity="0.4" stroke-width="0.8"/>
  <circle cx="32" cy="93" r="1.6" fill="#ffb000"/>

  <!-- "GW" wordmark -->
  <g font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700">
    <text x="148" y="62" font-size="34" fill="#f3f5f8" letter-spacing="-1">greyok</text>
    <text x="148" y="92" font-size="20" fill="url(#gw-grad)" letter-spacing="0.5">ui-framework</text>
    <!-- accent underline -->
    <line x1="148" y1="100" x2="226" y2="100" stroke="#ffb000" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
</svg>
