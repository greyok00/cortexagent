<!DOCTYPE html>
<html lang="en" data-theme="console">
<head>
  <meta charset="utf-8">
  <title>Security · grid variant</title>
  <link rel="stylesheet" href="../_elements/tokens.css">
  <link rel="stylesheet" href="../_elements/themes.css">
  <link rel="stylesheet" href="../_elements/base.css">
  <link rel="stylesheet" href="../_elements/elements-display.css">
  <link rel="stylesheet" href="../_elements/elements-lists.css">
  <link rel="stylesheet" href="../_elements/elements-containers.css">
  <link rel="stylesheet" href="../_elements/elements-dataviz.css">
  <link rel="stylesheet" href="../_elements/elements-size.css">
</head>
<body class="el-reset">
<div class="el-full-frame" style="padding:var(--el-space-4)">

  <h1 style="font:700 var(--el-fs-xl)/1 var(--el-font-display);margin:0;color:var(--el-ink)">Security overview <small style="font:var(--el-fs-sm) var(--el-font-mono);color:var(--el-accent);margin-left:var(--el-space-2)">console · GitHub-dark · bento grid</small></h1>

  <div class="el-bento" style="margin-top:var(--el-space-3)">
    <div class="tile span-6 tall"><div class="lbl">Threat score</div><div class="el-big-num fail">87<span class="lbl">/100</span></div><div class="el-barograph" style="height:32px"><span class="bar" style="height:30%"></span><span class="bar" style="height:50%"></span><span class="bar warn" style="height:80%"></span><span class="bar" style="height:60%"></span><span class="bar fail" style="height:90%"></span></div></div>
    <div class="tile span-3"><div class="lbl">CPU</div><div class="el-gauge warn"><div class="name">CPU</div><div class="val">88</div></div></div>
    <div class="tile span-3"><div class="lbl">MEM</div><div class="el-gauge ok"><div class="name">MEM</div><div class="val">42</div></div></div>
    <div class="tile span-4"><div class="lbl">Findings</div><div class="el-big-num warn">14<span class="lbl">open</span></div></div>
    <div class="tile span-4"><div class="lbl">Sources</div><div class="el-big-num">8<span class="lbl">/14</span></div></div>
    <div class="tile span-4"><div class="lbl">Playbooks</div><div class="el-big-num ok">9<span class="lbl">ready</span></div></div>
    <div class="tile span-12"><div class="lbl">Heatmap · 24h</div><div class="el-heatmap" style="grid-template-columns:repeat(24,12px)">
      <span class="cell"></span><span class="cell lvl-1"></span><span class="cell lvl-2"></span><span class="cell lvl-3"></span><span class="cell lvl-1"></span><span class="cell"></span><span class="cell lvl-4"></span><span class="cell lvl-2"></span><span class="cell lvl-1"></span><span class="cell"></span><span class="cell lvl-3"></span><span class="cell lvl-4"></span><span class="cell lvl-2"></span><span class="cell lvl-1"></span><span class="cell"></span><span class="cell lvl-2"></span><span class="cell lvl-3"></span><span class="cell lvl-4"></span><span class="cell lvl-1"></span><span class="cell"></span><span class="cell lvl-1"></span><span class="cell lvl-2"></span><span class="cell lvl-3"></span><span class="cell lvl-4"></span>
    </div></div>
  </div>

  <h2 style="font:700 var(--el-fs-xs) var(--el-font-mono);color:var(--el-ink-soft);letter-spacing:0.14em;text-transform:uppercase;margin:var(--el-space-3) 0 var(--el-space-1)">Status</h2>
  <div class="el-cluster">
    <span class="el-pill fail"><span class="el-dot fail"></span>auditd</span>
    <span class="el-pill fail"><span class="el-dot fail"></span>nft</span>
    <span class="el-pill fail"><span class="el-dot fail"></span>apparmor</span>
    <span class="el-pill fail"><span class="el-dot fail"></span>integrity</span>
    <span class="el-pill warn"><span class="el-dot warn"></span>firewall</span>
    <span class="el-pill ok"><span class="el-dot ok"></span>dns</span>
    <span class="el-pill ok"><span class="el-dot ok"></span>sshd</span>
    <span class="el-pill ok"><span class="el-dot ok"></span>fapolicy</span>
    <span class="el-pill ok"><span class="el-dot ok"></span>lockdown</span>
  </div>

  <div style="font:var(--el-fs-xs) var(--el-font-mono);color:var(--el-ink-soft);margin-top:var(--el-space-3);text-align:center;letter-spacing:0.08em">console · data-theme="console"</div>
</div>
</body>
</html>
