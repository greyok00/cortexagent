<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortexAgent — UI 1: Command Palette</title>
<style>
  :root { --bg:#0a0e1a; --panel:#131826; --text:#e6e9f0; --unknown:#94a3b8;
          --accent:#38bdf8; --accent-dim:#1f3a4d; --ok:#4ade80;
          --warn:#fbbf24; --fail:#f87171; --border:#2a3142; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
         font-size:14px; line-height:1.5; min-height:100vh; }
  /* Tabs */
  .tabs { display:flex; gap:4px; padding:12px 20px; background:#0d1325;
          border-bottom:1px solid var(--border); overflow-x:auto; }
  .tabs a { color:var(--unknown); text-decoration:none; padding:6px 10px;
            font-size:11px; border-radius:6px; border:1px solid transparent;
            white-space:nowrap; }
  .tabs a:hover { color:var(--text); border-color:var(--border); }
  .tabs a.active { color:var(--accent); border-color:var(--accent-dim);
                    background:rgba(56,189,248,0.06); }
  .tabs a.home { color:var(--warn); }
  /* Main shell */
  main { max-width:980px; margin:0 auto; padding:60px 20px 20px; }
  h1 { color:var(--accent); margin:0 0 4px 0; font-size:18px; }
  .sub { color:var(--unknown); font-size:12px; margin-bottom:32px; }
  .palette-wrap { position:relative; margin-bottom:32px; }
  .palette { width:100%; padding:18px 22px; font:inherit;
              background:var(--panel); color:var(--text);
              border:1px solid var(--border); border-radius:14px;
              outline:none; font-size:15px; }
  .palette:focus { border-color:var(--accent); }
  .palette::placeholder { color:var(--unknown); }
  .results { position:absolute; left:0; right:0; top:calc(100% + 8px);
              background:var(--panel); border:1px solid var(--border);
              border-radius:14px; max-height:480px; overflow-y:auto;
              z-index:20; }
  .results .group-label { padding:8px 16px 4px; color:var(--unknown);
                          font-size:10px; letter-spacing:0.12em; text-transform:uppercase; }
  .results .item { display:flex; justify-content:space-between;
                    padding:10px 16px; cursor:pointer; border-left:3px solid transparent; }
  .results .item:hover, .results .item.sel { background:rgba(56,189,248,0.06);
                                              border-left-color:var(--accent); }
  .results .item .name { color:var(--text); }
  .results .item .meta { color:var(--unknown); font-size:11px; }
  .pill { padding:2px 8px; border-radius:12px; font-size:10px;
          font-weight:600; color:#000; }
  .pill.ok { background:var(--ok); } .pill.warn { background:var(--warn); }
  .pill.fail { background:var(--fail); } .pill.critical { background:var(--fail); }
  .pill.high { background:var(--warn); } .pill.medium { background:#fb923c; }
  .pill.low { background:var(--ok); }
  /* Detail panel */
  .detail { background:var(--panel); border:1px solid var(--border);
            border-radius:14px; padding:20px; min-height:260px; }
  .detail h2 { color:var(--accent); margin:0 0 8px 0; font-size:16px; }
  .detail .empty { color:var(--unknown); text-align:center; padding:60px 0; }
  .detail .row { padding:6px 0; border-bottom:1px solid var(--border);
                 display:flex; justify-content:space-between; font-size:12px; }
  .detail .row:last-child { border:none; }
  .detail .row .k { color:var(--unknown); }
  .hint { color:var(--unknown); font-size:11px; margin-top:8px;
          text-align:right; }
  kbd { background:var(--bg); border:1px solid var(--border);
        border-radius:3px; padding:1px 5px; font-size:10px; color:var(--warn); }
</style>
</head>
<body>

<nav class="tabs">
  <a href="../ui-mockup.html" class="home">v0.1 grid</a>
  <a href="ui-1.html" class="active">1 · command</a>
  <a href="ui-2.html">2 · orbit</a>
  <a href="ui-3.html">3 · timeline</a>
  <a href="ui-4.html">4 · cards</a>
  <a href="ui-5.html">5 · sidebar</a>
  <a href="ui-6.html">6 · bento</a>
  <a href="ui-7.html">7 · tree</a>
  <a href="ui-8.html">8 · hud</a>
</nav>

<main>
  <h1>Command Palette</h1>
  <div class="sub">Type to filter every signal · arrow keys to navigate · Enter to inspect</div>

  <div class="palette-wrap">
    <input class="palette" id="p" placeholder="Search: ‘auditd’, ‘CVE’, ‘port’, ‘COLLECT’ …" autofocus>
    <div class="results" id="r"></div>
  </div>

  <div class="detail" id="d">
    <div class="empty">↑ pick a result above</div>
  </div>

  <div class="hint"><kbd>↑↓</kbd> navigate · <kbd>Enter</kbd> select · <kbd>esc</kbd> clear</div>
</main>

<script>
  // Same hardcoded data as v0.1
  const FINDINGS = [
    {id:'#22', sev:'critical', name:'port-scan 192.168.99.42', meta:'firewall · internal · 12 ports'},
    {id:'#12', sev:'high', name:'port-scan 1.2.3.4', meta:'firewall · external · 12 ports'},
    {id:'#3',  sev:'high', name:'rkhunter warning', meta:'scan · 1 warning'},
    {id:'#13', sev:'high', name:'rkhunter warning', meta:'scan · 1 warning'},
    {id:'#23', sev:'high', name:'rkhunter warning', meta:'scan · 1 warning'},
    {id:'#32', sev:'high', name:'kernel tainted 12801', meta:'scan · nvidia+errata+forced'},
    {id:'#33', sev:'high', name:'kernel tainted 12801', meta:'scan · nvidia+errata+forced'},
    {id:'#35', sev:'high', name:'kernel tainted 12801', meta:'scan · nvidia+errata+forced'},
    {id:'#36', sev:'high', name:'kernel tainted 12801', meta:'scan · nvidia+errata+forced'},
    {id:'#38', sev:'high', name:'kernel tainted 12801', meta:'scan · nvidia+errata+forced'},
    {id:'#39', sev:'high', name:'kernel tainted 12801', meta:'scan · nvidia+errata+forced'},
    {id:'#91', sev:'high', name:'kernel tainted 12801', meta:'scan · nvidia+errata+forced'},
  ];
  const HARDENING = [
    {name:'auditd',          s:'warn', note:'2 rules failed to load'},
    {name:'capabilities',    s:'ok',   note:'0 risky caps'},
    {name:'dns_blocklist',   s:'ok',   note:'98 062 entries'},
    {name:'dnsmasq',         s:'ok',   note:'resolv→127.0.0.1'},
    {name:'lsms',            s:'ok',   note:'7 active'},
    {name:'nftables',        s:'fail', note:'needs root'},
    {name:'apparmor',        s:'ok',   note:'profiles loaded'},
  ];
  const STAGES = ['COLLECT','COMPOSE','FRAME_OF_REF','MEMORY_CHECK','SLIMTOKEN','TOOL_ROUTING','FINALIZE','PREFILL','DECODE','DELIVER'];
  const SOAR = [
    {ts:'2026-08-19 02:11', name:'pb.fw.port-scan.isolate', res:'isolated host A'},
    {ts:'2026-08-19 01:47', name:'pb.cve.triage',           res:'3 low triaged'},
  ];

  const ALL = [
    ...FINDINGS.map(f => ({...f, kind:'finding'})),
    ...HARDENING.map(h => ({name:h.name, sev:h.s, note:h.note, kind:'hardening'})),
    ...STAGES.map(s => ({name:s, kind:'stage'})),
    ...SOAR.map(r => ({name:r.name, ts:r.ts, res:r.res, kind:'soar'})),
  ];

  const inp = document.getElementById('p');
  const out = document.getElementById('r');
  const det = document.getElementById('d');
  let sel = 0, filtered = ALL;

  function render() {
    const q = inp.value.toLowerCase().trim();
    filtered = q
      ? ALL.filter(x => JSON.stringify(x).toLowerCase().includes(q))
      : ALL;
    sel = 0;
    const groups = {};
    filtered.forEach(x => {
      (groups[x.kind] = groups[x.kind] || []).push(x);
    });
    const order = ['finding','hardening','stage','soar'];
    out.innerHTML = order.filter(g => groups[g]).map(g => `
      <div class="group-label">${g}${groups[g].length>1?' · '+groups[g].length:''}</div>
      ${groups[g].map((x,i) => `
        <div class="item ${(g===Object.keys(groups)[sel]?'':'')}" data-i="${ALL.indexOf(x)}">
          <span class="name">${x.name || x.id}</span>
          <span class="meta">${x.meta||x.note||x.ts||''}</span>
        </div>`).join('')}
    `).join('') || '<div class="empty" style="padding:30px;">no matches</div>';
    // Wire clicks
    out.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => pick(+el.dataset.i));
    });
    showDetail();
  }

  function pick(i) {
    const x = ALL[i]; if (!x) return;
    if (x.kind === 'finding') {
      det.innerHTML = `
        <h2>${x.id} · ${x.name} <span class="pill ${x.sev}">${x.sev.toUpperCase()}</span></h2>
        <div class="row"><span class="k">source</span><span>${x.meta.split(' · ')[0]}</span></div>
        <div class="row"><span class="k">detail</span><span>${x.meta.split(' · ').slice(1).join(' / ')}</span></div>
        <div class="row"><span class="k">actions</span><span>isolate · tag · copy</span></div>`;
    } else if (x.kind === 'hardening') {
      det.innerHTML = `
        <h2>${x.name} <span class="pill ${x.s}">${x.s.toUpperCase()}</span></h2>
        <div class="row"><span class="k">posture</span><span>${x.note}</span></div>
        <div class="row"><span class="k">subsystem</span><span>live probe @ :8093/api/hardening/status</span></div>
        <div class="row"><span class="k">actions</span><span>re-run · view logs</span></div>`;
    } else if (x.kind === 'stage') {
      det.innerHTML = `
        <h2>STAGE ${x.name}</h2>
        <div class="row"><span class="k">role</span><span>${STAGES.indexOf(x.name)+1} of 10</span></div>
        <div class="row"><span class="k">latency</span><span>~hold 5.0s</span></div>
        <div class="row"><span class="k">full 3D</span><span>:8090/pipeline</span></div>`;
    } else if (x.kind === 'soar') {
      det.innerHTML = `
        <h2>SOAR · ${x.name}</h2>
        <div class="row"><span class="k">timestamp</span><span>${x.ts}</span></div>
        <div class="row"><span class="k">result</span><span>${x.res}</span></div>`;
    }
  }

  function showDetail() {
    const items = out.querySelectorAll('.item');
    items.forEach(el => el.classList.remove('sel'));
    if (items[0]) pick(+items[0].dataset.i);
  }

  inp.addEventListener('input', render);
  inp.addEventListener('keydown', e => {
    const items = out.querySelectorAll('.item');
    if (e.key === 'ArrowDown') { sel = Math.min(sel+1, items.length-1); highlight(items); e.preventDefault(); }
    if (e.key === 'ArrowUp')   { sel = Math.max(sel-1, 0);             highlight(items); e.preventDefault(); }
    if (e.key === 'Enter')     { const it = items[sel]; if (it) pick(+it.dataset.i); }
    if (e.key === 'Escape')    { inp.value=''; render(); inp.focus(); }
  });
  function highlight(items) {
    items.forEach((el,i) => el.classList.toggle('sel', i===sel));
  }

  render();
</script>

</body>
</html>
