<!DOCTYPE html>
<html lang="en" data-theme="polaroid">
<head>
  <meta charset="utf-8">
  <title>OSINT · graph variant</title>
  <link rel="stylesheet" href="../_elements/tokens.css">
  <link rel="stylesheet" href="../_elements/themes.css">
  <link rel="stylesheet" href="../_elements/base.css">
  <link rel="stylesheet" href="../_elements/elements-display.css">
  <link rel="stylesheet" href="../_elements/elements-lists.css">
  <link rel="stylesheet" href="../_elements/elements-dataviz.css">
  <link rel="stylesheet" href="../_elements/elements-containers.css">
  <link rel="stylesheet" href="../_elements/elements-size.css">
</head>
<body class="el-reset">
<div class="el-lg-frame" style="padding:var(--el-space-4)">

  <h1 style="font:700 var(--el-fs-xl)/1 var(--el-font-display);margin:0;color:var(--el-accent)">Entity graph <small style="font:var(--el-fs-sm) var(--el-font-body);color:var(--el-ink-soft);margin-left:var(--el-space-2)">polaroid · warm paper</small></h1>

  <div class="el-entity-graph" style="width:100%;height:480px;margin-top:var(--el-space-3)">
    <div class="edge" style="left:50%;top:50%;width:160px;transform:rotate(20deg)"></div>
    <div class="edge" style="left:50%;top:50%;width:160px;transform:rotate(-40deg)"></div>
    <div class="edge" style="left:50%;top:50%;width:160px;transform:rotate(160deg)"></div>
    <div class="edge" style="left:50%;top:50%;width:140px;transform:rotate(60deg)"></div>
    <div class="edge" style="left:50%;top:50%;width:140px;transform:rotate(-110deg)"></div>
    <div class="edge" style="left:50%;top:50%;width:120px;transform:rotate(-160deg)"></div>
    <div class="edge" style="left:50%;top:50%;width:120px;transform:rotate(110deg)"></div>
    <div class="edge" style="left:50%;top:50%;width:100px;transform:rotate(0deg)"></div>
    <div class="node center" style="left:50%;top:50%" title="192.0.2.41"></div>
    <div class="node lvl-1" style="left:80%;top:30%" title="AS-12345"></div>
    <div class="node lvl-1" style="left:25%;top:70%" title="AS-67890"></div>
    <div class="node lvl-1" style="left:75%;top:75%" title="domain-bad.tld"></div>
    <div class="node lvl-2" style="left:30%;top:25%" title="192.0.2.42"></div>
    <div class="node lvl-2" style="left:20%;top:35%" title="192.0.2.43"></div>
    <div class="node lvl-2" style="left:88%;top:50%" title="email@bad.tld"></div>
    <div class="node lvl-2" style="left:15%;top:55%" title="user-007"></div>
    <div class="node lvl-2" style="left:50%;top:15%" title="CVE-2026-042"></div>
  </div>

  <h2 style="font:700 var(--el-fs-xs) var(--el-font-mono);color:var(--el-ink-soft);letter-spacing:0.14em;text-transform:uppercase;margin:var(--el-space-3) 0 var(--el-space-1)">Legend</h2>
  <div class="el-cluster">
    <span class="el-dot live"></span> subject
    <span class="el-dot warn"></span> tier 1
    <span class="el-dot" style="background:var(--el-ink-soft)"></span> tier 2
  </div>

  <div style="font:var(--el-fs-xs) var(--el-font-mono);color:var(--el-ink-soft);margin-top:var(--el-space-3);text-align:center;letter-spacing:0.08em">polaroid · data-theme="polaroid"</div>
</div>
</body>
</html>
