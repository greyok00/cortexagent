<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORKFLOW — Spatial Operator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#050510;font-family:'Inter',system-ui,-apple-system,sans-serif;color:rgba(255,255,255,0.7)}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 30% 30% at 25% 35%,rgba(59,130,246,0.10),transparent),
    radial-gradient(ellipse 25% 25% at 75% 65%,rgba(139,92,246,0.08),transparent),
    radial-gradient(ellipse 20% 20% at 55% 80%,rgba(6,182,212,0.06),transparent);
  animation:nebula 30s ease-in-out infinite alternate;
}
@keyframes nebula{0%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}100%{opacity:0.6;transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}

#loading{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#05050a;z-index:1000;transition:opacity 0.6s ease;flex-direction:column;gap:12px;
}
#loading.fade{opacity:0;pointer-events:none}
#loading .spinner{width:40px;height:40px;border:2px solid rgba(100,200,255,0.1);border-top-color:rgba(100,200,255,0.6);border-radius:50%;animation:spin 0.8s linear infinite}
#loading .label{color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:0.1em;text-transform:uppercase}

#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;pointer-events:none;
}
#hud>*{pointer-events:auto}
#logo{font-size:13px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.5)}
#logo span{color:rgba(100,200,255,0.7)}

#nav{display:flex;gap:3px;background:rgba(10,10,26,0.6);backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:3px}
.nav-btn{background:transparent;border:none;color:rgba(255,255,255,0.4);padding:6px 14px;border-radius:7px;font-size:11px;font-weight:500;letter-spacing:0.05em;cursor:pointer;transition:all 0.2s ease;font-family:inherit}
.nav-btn:hover{color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.04)}
.nav-btn.active{color:rgba(255,255,255,0.9);background:rgba(59,130,246,0.15);box-shadow:0 0 20px rgba(59,130,246,0.1)}

#status{position:fixed;bottom:16px;right:24px;z-index:100;font-size:9px;letter-spacing:0.08em;color:rgba(255,255,255,0.15)}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;font-size:10px;letter-spacing:0.08em;color:rgba(255,255,255,0.15);pointer-events:none;transition:opacity 0.5s ease}
#hint.hidden{opacity:0}

/* Panel styles */
.panel{
  position:absolute;background:rgba(10,10,26,0.85);backdrop-filter:blur(24px) saturate(150%);
  border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:16px;
  font-family:'Inter',system-ui,sans-serif;font-size:12px;line-height:1.5;
  pointer-events:auto;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.35);
  transition:border-color 0.3s ease,box-shadow 0.3s ease;
}
.panel:hover{border-color:rgba(255,255,255,0.12)}
.panel .glow{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(100,200,255,0.25),transparent);pointer-events:none}
.panel .pin-btn{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.3);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all 0.2s;opacity:0}
.panel:hover .pin-btn{opacity:1}
.panel .pin-btn:hover{background:rgba(59,130,246,0.2);border-color:rgba(59,130,246,0.3);color:rgba(100,200,255,0.7)}
.panel .drag-handle{position:absolute;top:0;left:0;right:0;height:32px;cursor:grab;z-index:2}
.panel .drag-handle:active{cursor:grabbing}
.panel .resize-handle{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3}
.panel .resize-handle:hover{background:rgba(100,200,255,0.15);border-radius:3px}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div class="label">Initializing Workflow Engine</div></div>

<div id="hud">
  <div id="logo">◈ <span>Workflow</span> Operator</div>
  <div id="nav">
    <button class="nav-btn active" data-tab="overview">Overview</button>
    <button class="nav-btn" data-tab="agents">Agents</button>
    <button class="nav-btn" data-tab="metrics">Metrics</button>
  </div>
</div>

<div id="hint">Drag side panels · Resize center · Drag to orbit</div>
<div id="status">-- FPS</div>

<script>
window.onerror = function(msg, url, line, col, err) {
  var el = document.getElementById('errbox');
  if (el) {
    el.style.display = 'block';
    document.getElementById('errmsg').textContent = msg;
    document.getElementById('errstack').textContent = (err && err.stack) || 'line ' + line + ':' + col;
  }
  return true;
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Three.js loaded via script tags, available as THREE global

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color('#050510');
scene.fog = new THREE.Fog('#050510', 18, 40);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 16);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.domElement.style.cssText = 'position:fixed;top:0;left:0;z-index:1';
document.body.appendChild(renderer.domElement);

// ── Controls with auto-orbit ──
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.5;
controls.minDistance = 8;
controls.maxDistance = 30;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.update();

// ── Lights ──
scene.add(new THREE.AmbientLight(0x222244, 0.4));
const dl = new THREE.DirectionalLight(0x4488ff, 0.6);
dl.position.set(5, 10, 7);
scene.add(dl);

// ── Wireframe Cube ──
const cg = new THREE.BoxGeometry(7, 5, 7);
const ce = new THREE.EdgesGeometry(cg);
const cm = new THREE.LineBasicMaterial({color:0x1a3a6a,transparent:true,opacity:0.08});
const cube = new THREE.LineSegments(ce, cm);
cube.position.set(0, 0, -3);
scene.add(cube);

// ── Tiny Background Orbs ──
const orbCount = 60;
const orbs = [];
for (let i = 0; i < orbCount; i++) {
  const size = 0.03 + Math.random() * 0.1;
  const g = new THREE.SphereGeometry(size, 8, 8);
  const hue = 0.55 + Math.random() * 0.25;
  const c = new THREE.Color().setHSL(hue, 0.8, 0.5 + Math.random() * 0.3);
  const m = new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:0.2 + Math.random() * 0.3});
  const mesh = new THREE.Mesh(g, m);
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.random() * Math.PI * 2;
  const r = 5 + Math.random() * 10;
  mesh.position.set(Math.sin(theta)*Math.cos(phi)*r, (Math.random()-0.5)*6, Math.sin(theta)*Math.sin(phi)*r - 3);
  mesh.userData = {theta, phi, r, sp:0.05+Math.random()*0.1, phSp:(Math.random()-0.5)*0.05, fl:Math.random()*100, fs:0.2+Math.random()*0.3, fa:0.1+Math.random()*0.2};
  scene.add(mesh);
  orbs.push(mesh);
}

// ── Particles ──
const pCount = 2000;
const pg = new THREE.BufferGeometry();
const pp = new Float32Array(pCount*3);
const pc = new Float32Array(pCount*3);
const pv = [];
for (let i = 0; i < pCount; i++) {
  const i3=i*3;
  pp[i3]=(Math.random()-0.5)*50; pp[i3+1]=(Math.random()-0.5)*35; pp[i3+2]=(Math.random()-0.5)*35-5;
  const h=0.55+Math.random()*0.2; const col=new THREE.Color().setHSL(h,0.7,0.5+Math.random()*0.3);
  pc[i3]=col.r; pc[i3+1]=col.g; pc[i3+2]=col.b;
  pv.push({x:(Math.random()-0.5)*0.003, y:(Math.random()-0.5)*0.003});
}
pg.setAttribute('position', new THREE.Float32BufferAttribute(pp, 3));
pg.setAttribute('color', new THREE.Float32BufferAttribute(pc, 3));
const pm = new THREE.PointsMaterial({size:0.03, vertexColors:true, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, sizeAttenuation:true});
const particles = new THREE.Points(pg, pm);
scene.add(particles);

// ── CSS 3D Panels ──
const container = document.createElement('div');
container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;perspective:1200px;perspective-origin:50% 50%;pointer-events:none';
document.body.appendChild(container);

const world = document.createElement('div');
world.style.cssText = 'width:100%;height:100%;transform-style:preserve-3d;transform:translate3d(0,0,-400px)';
container.appendChild(world);

// ── Panel System ──
const panels = new Map(); // id -> {el, x, y, z, w, h, pinned, tab}
let dragState = null;
let resizeState = null;
let currentTab = 'overview';

// Helper to build HTML without nested template literals
function barRow(label, value, pct) {
  return '<div><div style="display:flex;justify-content:space-between;color:rgba(255,255,255,0.35);margin-bottom:2px"><span>' + label + '</span><span style="color:rgba(255,255,255,0.6)">' + value + '</span></div><div style="height:2px;background:rgba(255,255,255,0.03);border-radius:2px"><div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:2px"></div></div></div>';
}
function queueItem(title, desc, prio, bg, bd) {
  return '<div style="padding:6px 8px;background:' + bg + ';border:1px solid ' + bd + ';border-radius:6px"><div style="display:flex;justify-content:space-between"><span style="color:rgba(255,255,255,0.6)">' + title + '</span><span style="color:rgba(255,255,255,0.3);font-size:7px">' + prio + '</span></div><div style="font-size:8px;color:rgba(255,255,255,0.25);margin-top:2px">' + desc + '</div></div>';
}
function tag(label, color, bg) {
  return '<span style="font-size:7px;padding:1px 4px;border-radius:2px;background:' + bg + ';color:' + color + '">' + label + '</span>';
}

// Tab definitions
const tabContent = {
  overview: [
    {id:'sys', title:'System', w:'15vw', h:'85vh',
      content: '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><span style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(100,200,255,0.5)">⚙ System</span><span style="font-size:8px;color:rgba(16,182,133,0.7)">● Online</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:10px">' +
        barRow('CPU','67%',67) + barRow('VRAM','14.3/16 GB',89) + barRow('Memory','2.4K entries',45) + barRow('Agents','12 active',60) +
        '<div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)"><div style="color:rgba(100,200,255,0.4);font-size:8px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px">Active Workflow</div><div style="color:rgba(255,255,255,0.6);font-size:10px">Pentest: Internal Network</div><div style="display:flex;gap:3px;margin-top:3px;flex-wrap:wrap">' +
        tag('Recon ✅','rgba(16,182,133,0.7)','rgba(16,182,133,0.12)') + tag('Scan ✅','rgba(16,182,133,0.7)','rgba(16,182,133,0.12)') + tag('Exploit 🔄','rgba(245,158,11,0.7)','rgba(245,158,11,0.12)') + tag('Report ⏳','rgba(255,255,255,0.25)','rgba(255,255,255,0.03)') +
        '</div></div></div>'},
    {id:'chat', title:'Chat', w:'55vw', h:'85vh', main:true,
      content: '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(100,200,255,0.5)">◆ Workflow Chat</span><span style="font-size:8px;color:rgba(16,182,133,0.6)">● CortexAgent</span></div><div style="flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px"><div style="display:flex;gap:5px;align-items:flex-start"><span style="font-size:7px;padding:1px 3px;border-radius:2px;background:rgba(59,130,246,0.12);color:rgba(100,200,255,0.6);margin-top:2px;flex-shrink:0">AI</span><div style="font-size:10px;color:rgba(255,255,255,0.5);line-height:1.4">Workflow engine ready. 3/6 steps complete.</div></div><div style="display:flex;gap:5px;align-items:flex-start"><span style="font-size:7px;padding:1px 3px;border-radius:2px;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.3);margin-top:2px;flex-shrink:0">You</span><div style="font-size:10px;color:rgba(255,255,255,0.6)">Run vulnerability scan on target subnet.</div></div></div><div style="display:flex;gap:5px;margin-top:5px;align-items:center"><div style="flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:6px;padding:0 8px"><input style="flex:1;background:transparent;border:none;outline:none;color:rgba(255,255,255,0.5);font-size:10px;font-family:inherit;padding:6px 0" placeholder="Send workflow command..."></div><button style="background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.2);border-radius:6px;padding:6px 10px;font-size:9px;color:rgba(100,200,255,0.6);cursor:pointer;font-family:inherit">Execute</button></div>'},
    {id:'queue', title:'Queue', w:'15vw', h:'85vh',
      content: '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><span style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(139,92,246,0.5)">⚡ Queue</span><span style="font-size:8px;color:rgba(236,72,153,0.7)">3 pending</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px;font-size:10px">' +
        queueItem('Vulnerability Scan','Nmap + Nuclei on 10.0.0.0/24','P1','rgba(245,158,11,0.1)','rgba(245,158,11,0.12)') +
        queueItem('Credential Audit','Hashcat on extracted hashes','P2','rgba(139,92,246,0.1)','rgba(139,92,246,0.12)') +
        queueItem('Report Gen','Compile findings','P3','rgba(59,130,246,0.1)','rgba(59,130,246,0.12)') +
      '</div>'}
  ],
  agents: [
    {id:'ag-list', title:'Agents', w:'20vw', h:'85vh', content:'<div style="color:rgba(255,255,255,0.4);font-size:10px">Agent list panel</div>'},
    {id:'ag-detail', title:'Detail', w:'60vw', h:'85vh', main:true, content:'<div style="color:rgba(255,255,255,0.4);font-size:10px">Agent detail panel</div>'},
    {id:'ag-log', title:'Log', w:'20vw', h:'85vh', content:'<div style="color:rgba(255,255,255,0.4);font-size:10px">Agent log panel</div>'}
  ],
  metrics: [
    {id:'mt-perf', title:'Performance', w:'25vw', h:'85vh', content:'<div style="color:rgba(255,255,255,0.4);font-size:10px">Performance metrics</div>'},
    {id:'mt-main', title:'Metrics', w:'50vw', h:'85vh', main:true, content:'<div style="color:rgba(255,255,255,0.4);font-size:10px">Main metrics display</div>'},
    {id:'mt-cost', title:'Cost', w:'25vw', h:'85vh', content:'<div style="color:rgba(255,255,255,0.4);font-size:10px">Cost tracking</div>'}
  ]
};

// Pinned panels (persist across tabs)
let pinnedPanels = [];

function createPanelEl(cfg, isPinned = false) {
  const el = document.createElement('div');
  el.className = 'panel';
  const w = typeof cfg.w === 'number' ? cfg.w + 'px' : cfg.w;
  const h = typeof cfg.h === 'number' ? cfg.h + 'px' : cfg.h;
  el.style.cssText += `width:${w};height:${h};`;
  el.dataset.id = cfg.id;
  el.dataset.main = cfg.main ? 'true' : 'false';

  // Drag handle (top bar)
  const dh = document.createElement('div');
  dh.className = 'drag-handle';
  el.appendChild(dh);

  // Glow line
  const glow = document.createElement('div');
  glow.className = 'glow';
  el.appendChild(glow);

  // Pin button
  const pin = document.createElement('button');
  pin.className = 'pin-btn';
  pin.textContent = isPinned ? '−' : '+';
  pin.title = isPinned ? 'Unpin' : 'Pin to main';
  el.appendChild(pin);

  // Content
  const content = document.createElement('div');
  content.style.cssText = 'height:100%;display:flex;flex-direction:column;position:relative;z-index:1';
  content.innerHTML = cfg.content;
  el.appendChild(content);

  // Resize handle (only for main panel)
  if (cfg.main) {
    const rh = document.createElement('div');
    rh.className = 'resize-handle';
    el.appendChild(rh);
  }

  // Drag logic
  dh.addEventListener('mousedown', e => {
    e.preventDefault();
    dragState = {id:cfg.id, startX:e.clientX, startY:e.clientY, origX:0, origY:0};
    const t = panelTransforms.get(cfg.id);
    if (t) { dragState.origX = t.x; dragState.origY = t.y; }
  });

  // Pin logic
  pin.addEventListener('click', () => {
    if (isPinned) {
      pinnedPanels = pinnedPanels.filter(p => p !== cfg.id);
      rebuild();
    } else {
      pinnedPanels.push(cfg.id);
      rebuild();
    }
  });

  // Resize logic (main panel only)
  if (cfg.main) {
    rh.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      resizeState = {id:cfg.id, startX:e.clientX, startW:el.offsetWidth};
    });
  }

  return el;
}

// Panel transforms (world-space positions)
const panelTransforms = new Map();

function rebuild() {
  // Clear
  while (world.firstChild) world.removeChild(world.firstChild);
  panels.clear();
  panelTransforms.clear();

  // Get current tab panels + pinned panels from other tabs
  const tabPanels = tabContent[currentTab] || [];
  const allPanels = [...tabPanels];

  // Add pinned panels from other tabs
  if (pinnedPanels.length > 0) {
    for (const [tab, pList] of Object.entries(tabContent)) {
      if (tab === currentTab) continue;
      for (const p of pList) {
        if (pinnedPanels.includes(p.id) && !allPanels.find(ap => ap.id === p.id)) {
          allPanels.push({...p, _pinned:true});
        }
      }
    }
  }

  const GAP = 80;
  const vw = window.innerWidth / 100;

  // Create elements
  const panelData = allPanels.map(cfg => {
    const isPinned = cfg._pinned || pinnedPanels.includes(cfg.id);
    const el = createPanelEl(cfg, isPinned);
    world.appendChild(el);
    panels.set(cfg.id, el);
    let pw = el.offsetWidth;
    if (!pw && typeof cfg.w === 'string' && cfg.w.endsWith('vw')) pw = parseFloat(cfg.w) * vw;
    return {id:cfg.id, el, pw:pw || 400, cfg};
  });

  // Calculate positions: main panel centered, others on sides
  const mainIdx = panelData.findIndex(d => d.cfg.main);
  const mainPw = mainIdx >= 0 ? panelData[mainIdx].pw : 600;

  // Left panels (before main)
  let curX = -(mainPw + (panelData.length - 1) * GAP) / 2;
  if (mainIdx > 0) {
    const leftTotal = panelData.slice(0, mainIdx).reduce((s, d) => s + d.pw, 0) + mainIdx * GAP;
    curX = -(mainPw + leftTotal + (panelData.length - 1 - mainIdx) * GAP) / 2;
  }

  panelData.forEach((d, i) => {
    const cx = curX + d.pw / 2;
    const cy = 0;
    const cz = d.cfg.main ? -0.5 : -1.5;
    panelTransforms.set(d.id, {x:cx, y:cy, z:cz, pw:d.pw, ph:d.el.offsetHeight || 600});
    curX += d.pw + GAP;
  });

  applyTransforms();
}

function applyTransforms() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  panelTransforms.forEach((t, id) => {
    const el = panels.get(id);
    if (!el) return;
    const px = t.x + W / 2 - t.pw / 2;
    const py = t.y + H / 2 - t.ph / 2;
    el.style.transform = `translate3d(${px}px,${py}px,${t.z * 120}px)`;
  });
}

// ── Global mouse events for drag/resize ──
document.addEventListener('mousemove', e => {
  if (dragState) {
    const dx = (e.clientX - dragState.startX);
    const dy = (e.clientY - dragState.startY);
    const t = panelTransforms.get(dragState.id);
    if (t) {
      t.x = dragState.origX + dx;
      t.y = dragState.origY + dy;
      applyTransforms();
    }
  }
  if (resizeState) {
    const dx = e.clientX - resizeState.startX;
    const newW = Math.max(200, resizeState.startW + dx);
    const el = panels.get(resizeState.id);
    if (el) {
      el.style.width = newW + 'px';
      // Recalculate positions
      const vw = window.innerWidth / 100;
      const allData = [];
      panelTransforms.forEach((t, id) => {
        const e = panels.get(id);
        allData.push({id, pw: e ? e.offsetWidth : 400, el: e});
      });
      const mainIdx = allData.findIndex(d => d.id === resizeState.id);
      const GAP = 80;
      let curX = 0;
      // Calculate total width
      const totalW = allData.reduce((s, d) => s + d.pw, 0) + (allData.length - 1) * GAP;
      curX = -totalW / 2;
      allData.forEach(d => {
        const t = panelTransforms.get(d.id);
        if (t) {
          t.x = curX + d.pw / 2;
          t.pw = d.pw;
        }
        curX += d.pw + GAP;
      });
      applyTransforms();
    }
  }
});

document.addEventListener('mouseup', () => {
  dragState = null;
  resizeState = null;
});

// ── Tab switching ──
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    rebuild();
  });
});

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  applyTransforms();
});

// ── Init ──
rebuild();
setTimeout(() => document.getElementById('loading').classList.add('fade'), 400);

// ── Animation Loop ──
let lastTime = performance.now();
let fc = 0, ft = 0;
const fpsEl = document.getElementById('status');

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  fc++; ft += dt;
  if (ft >= 0.5) { fpsEl.textContent = Math.round(fc/ft) + ' FPS'; fc = 0; ft = 0; }

  // Rotate cube
  cube.rotation.x += dt * 0.03;
  cube.rotation.y += dt * 0.05;

  // Animate tiny orbs
  orbs.forEach(o => {
    const u = o.userData;
    u.theta += u.sp * dt;
    u.phi += u.phSp * dt;
    o.position.x = Math.sin(u.theta)*Math.cos(u.phi)*u.r;
    o.position.y = Math.sin(u.phi)*u.r + Math.sin(now*0.001*u.fs+u.fl)*u.fa;
    o.position.z = Math.cos(u.theta)*Math.cos(u.phi)*u.r - 3;
  });

  // Particles
  const pa = particles.geometry.attributes.position.array;
  for (let i = 0; i < pCount; i++) {
    const i3=i*3;
    pa[i3] += pv[i].x + Math.sin(now*0.0003+i*0.05)*0.0005;
    pa[i3+1] += pv[i].y + Math.cos(now*0.0004+i*0.03)*0.0004;
  }
  particles.geometry.attributes.position.needsUpdate = true;
  particles.rotation.y += dt * 0.015;

  controls.update();
  renderer.render(scene, camera);
}

animate(performance.now());
</script>
